<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>BoatOS Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #F2F2F7;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .header {
            background: white;
            padding: max(env(safe-area-inset-top), 16px) 16px 16px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #000;
        }

        .header p {
            font-size: 14px;
            color: #8E8E93;
            margin-top: 4px;
        }

        .quick-actions {
            padding: 20px 16px;
        }

        .actions-title {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            margin-bottom: 16px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .anchor-alarm-button {
            margin-top: 16px;
            background: #8E8E93;
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .anchor-alarm-button:active {
            transform: scale(0.98);
        }

        .anchor-alarm-button.inactive {
            background: #8E8E93;
        }

        .anchor-alarm-button.safe {
            background: linear-gradient(135deg, #34C759 0%, #30D158 100%);
        }

        .anchor-alarm-button.warning {
            background: linear-gradient(135deg, #FF9500 0%, #FF9F0A 100%);
        }

        .anchor-alarm-button.dragging {
            background: linear-gradient(135deg, #FF3B30 0%, #FF453A 100%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .action-card {
            background: white;
            border-radius: 16px;
            padding: 24px 20px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .action-card:active {
            transform: scale(0.97);
        }

        .action-card-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .action-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .action-card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #007AFF;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Different card colors */
        .action-card:nth-child(1) {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-card:nth-child(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .action-card:nth-child(3) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .action-card:nth-child(4) {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .more-section {
            padding: 0 16px 20px 16px;
        }

        .more-title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin-bottom: 12px;
        }

        .more-links {
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .more-link {
            display: flex;
            align-items: center;
            padding: 16px;
            text-decoration: none;
            color: #000;
            border-bottom: 1px solid #F2F2F7;
        }

        .more-link:last-child {
            border-bottom: none;
        }

        .more-link-icon {
            font-size: 24px;
            margin-right: 12px;
            width: 32px;
            text-align: center;
        }

        .more-link-text {
            flex: 1;
            font-size: 16px;
        }

        .more-link-arrow {
            color: #C7C7CC;
        }

        /* User To-Do List */
        .user-todo-list {
            margin-top: 12px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #8E8E93;
        }

        .todo-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .todo-item.overdue {
            border-left: 4px solid #FF3B30;
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .todo-title {
            font-size: 16px;
            font-weight: 600;
            color: #000;
            flex: 1;
        }

        .todo-due {
            font-size: 12px;
            color: #8E8E93;
            margin-top: 4px;
        }

        .todo-due.overdue {
            color: #FF3B30;
            font-weight: 600;
        }

        .todo-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
        }

        .todo-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .todo-btn:active {
            transform: scale(0.97);
        }

        .todo-btn-complete {
            background: #34C759;
            color: white;
        }

        .todo-btn-view {
            background: #007AFF;
            color: white;
        }

        .empty-todo {
            text-align: center;
            padding: 40px 20px;
            color: #8E8E93;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⛵ BoatOS Mobile</h1>
        <p>Quick Access Dashboard</p>
    </div>

    <div class="quick-actions">
        <h2 class="actions-title">Quick Actions</h2>
        <div class="actions-grid">
            <a href="/public/index-mobile.html" class="action-card">
                <div class="action-card-icon">💬</div>
                <div class="action-card-title">AI Chat</div>
            </a>
            <a href="#" class="action-card" data-maintenance-url="/user-tasks-mobile.html">
                <div class="action-card-icon">➕</div>
                <div class="action-card-title">Add Task</div>
            </a>
            <a href="#" class="action-card" data-maintenance-url="/app-mobile.html">
                <div class="action-card-icon">🔧</div>
                <div class="action-card-title">Maintenance</div>
            </a>
            <a href="#" class="action-card" data-maintenance-url="/edit-user-task-mobile.html">
                <div class="action-card-icon">✏️</div>
                <div class="action-card-title">Edit Task</div>
            </a>
        </div>
        <a href="/public/anchor-watch-admin.html" id="anchorAlarmBtn" class="anchor-alarm-button inactive">
            <span id="anchorAlarmIcon">⚓</span>
            <span id="anchorAlarmText">Anchor Alarm - Not Set</span>
        </a>
    </div>

    <div class="more-section">
        <h3 class="more-title">User To-Do</h3>
        <div id="userTodoList" class="user-todo-list">
            <div class="loading">Loading tasks...</div>
        </div>
    </div>

    <script>
        // Check for admin token in URL and store it
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (urlToken) {
            localStorage.setItem('adminToken', urlToken);
            // Remove token from URL for security
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        const ADMIN_TOKEN = localStorage.getItem('adminToken') || '';

        // Auto-detect maintenance service URL based on current hostname
        function getMaintenanceUrl() {
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;

            // Production domain
            if (hostname === 'chat.catamaranos.com') {
                return 'https://admin.catamaranos.com';
            }

            // Render production
            if (hostname === 'boatos-main.onrender.com') {
                return 'https://boatos-maintenance.onrender.com';
            }

            // Localhost
            if (hostname === 'localhost') {
                return 'http://localhost:3001';
            }

            // Local IP (e.g., 192.168.20.106)
            if (hostname.match(/^\d+\.\d+\.\d+\.\d+$/)) {
                return `${protocol}//${hostname}:3001`;
            }

            // Fallback to localhost
            return 'http://localhost:3001';
        }

        const MAINTENANCE_URL = getMaintenanceUrl();

        // Set up maintenance links
        document.querySelectorAll('[data-maintenance-url]').forEach(element => {
            const path = element.getAttribute('data-maintenance-url');
            element.href = MAINTENANCE_URL + path;
        });

        // Haptic feedback for iOS
        document.querySelectorAll('.action-card, .anchor-alarm-button').forEach(card => {
            card.addEventListener('click', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });

        // Load and display user tasks
        async function loadUserTasks() {
            const listContainer = document.getElementById('userTodoList');

            if (!ADMIN_TOKEN) {
                listContainer.innerHTML = '<div class="empty-todo">🔒 Login required to view tasks</div>';
                return;
            }

            try {
                // Fetch todos from maintenance agent API
                const response = await fetch(`${MAINTENANCE_URL}/admin/api/todo`, {
                    headers: {
                        'x-admin-token': ADMIN_TOKEN
                    }
                });
                const result = await response.json();

                if (!result.success || !result.data || !result.data.todos || result.data.todos.length === 0) {
                    listContainer.innerHTML = '<div class="empty-todo">✅ No pending tasks!</div>';
                    return;
                }

                // Filter to only user-created tasks
                let tasks = result.data.todos.filter(task =>
                    task.type === 'user_task'
                );

                if (tasks.length === 0) {
                    listContainer.innerHTML = '<div class="empty-todo">✅ No user tasks!</div>';
                    return;
                }

                // Sort: overdue first, then by due date
                const now = new Date();
                tasks.sort((a, b) => {
                    const aDate = a.dueDate ? new Date(a.dueDate) : null;
                    const bDate = b.dueDate ? new Date(b.dueDate) : null;
                    const aOverdue = aDate && aDate < now;
                    const bOverdue = bDate && bDate < now;

                    if (aOverdue && !bOverdue) return -1;
                    if (!aOverdue && bOverdue) return 1;
                    if (aDate && bDate) return aDate - bDate;
                    return 0;
                });

                // Limit to 20 tasks
                tasks = tasks.slice(0, 20);

                // Render tasks
                listContainer.innerHTML = tasks.map(task => renderTask(task)).join('');

            } catch (error) {
                console.error('Error loading tasks:', error);
                listContainer.innerHTML = '<div class="empty-todo">⚠️ Failed to load tasks</div>';
            }
        }

        function renderTask(task) {
            const now = new Date();
            const dueDate = task.dueDate ? new Date(task.dueDate) : null;
            const isOverdue = dueDate && dueDate < now;
            const dueDateStr = dueDate ? dueDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'No due date';

            const canComplete = task.type === 'user_task' && task.metadata?.taskId && task.metadata?.assetUid;
            const taskId = task.metadata?.taskId || '';
            const assetUid = task.metadata?.assetUid || '';

            // Fix localhost URLs to use correct hostname
            let actionUrl = task.actionUrl || '#';
            if (actionUrl.includes('localhost:3001')) {
                actionUrl = actionUrl.replace('http://localhost:3001', MAINTENANCE_URL);
            }

            return `
                <div class="todo-item ${isOverdue ? 'overdue' : ''}">
                    <div class="todo-header">
                        <div>
                            <div class="todo-title">${task.title || 'Untitled Task'}</div>
                            <div class="todo-due ${isOverdue ? 'overdue' : ''}">
                                ${isOverdue ? '🔴 Overdue: ' : '📅 Due: '}${dueDateStr}
                            </div>
                        </div>
                    </div>
                    ${task.description ? `<div class="todo-description">${task.description}</div>` : ''}
                    <div class="todo-actions">
                        ${canComplete ? `
                            <button class="todo-btn todo-btn-complete" onclick="markTaskComplete('${taskId}', '${assetUid}', '${task.type}')">
                                ✓ Complete
                            </button>
                        ` : ''}
                        <button class="todo-btn todo-btn-view" onclick="window.location.href='${actionUrl}'">
                            View Details
                        </button>
                    </div>
                </div>
            `;
        }

        async function markTaskComplete(taskId, assetUid, taskType) {
            if (!confirm('Mark this task as complete?')) return;

            if (!ADMIN_TOKEN) {
                alert('❌ Admin token required. Please log in again.');
                return;
            }

            // Find and fade out the task element immediately (optimistic UI)
            const taskElements = document.querySelectorAll('.todo-item');
            let taskElement = null;
            taskElements.forEach(el => {
                const completeBtn = el.querySelector('.todo-btn-complete');
                if (completeBtn && completeBtn.getAttribute('onclick').includes(taskId)) {
                    taskElement = el;
                }
            });

            if (taskElement) {
                taskElement.style.opacity = '0.5';
                taskElement.style.pointerEvents = 'none';
            }

            try {
                let response;

                // Route to correct endpoint based on task type
                if (taskType === 'user_task') {
                    // User tasks use their own completion endpoint
                    response = await fetch(`${MAINTENANCE_URL}/admin/api/user-tasks/${taskId}/complete`, {
                        method: 'POST',
                        headers: {
                            'x-admin-token': ADMIN_TOKEN
                        }
                    });
                } else {
                    // Maintenance/BoatOS tasks use task-completions endpoint
                    response = await fetch(`${MAINTENANCE_URL}/admin/api/task-completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-admin-token': ADMIN_TOKEN
                        },
                        body: JSON.stringify({
                            taskId: taskId,
                            assetUid: assetUid || null,
                            completionNotes: 'Completed from mobile dashboard'
                        })
                    });
                }

                const result = await response.json();

                if (result.success) {
                    // Remove task from DOM immediately
                    if (taskElement) {
                        taskElement.remove();
                    }

                    // Refresh list after short delay to ensure DB is updated
                    setTimeout(() => {
                        loadUserTasks();
                    }, 500);
                } else {
                    // Restore task visibility on error
                    if (taskElement) {
                        taskElement.style.opacity = '1';
                        taskElement.style.pointerEvents = 'auto';
                    }
                    throw new Error(result.error?.message || 'Failed to mark complete');
                }
            } catch (error) {
                console.error('Error completing task:', error);
                // Restore task visibility on error
                if (taskElement) {
                    taskElement.style.opacity = '1';
                    taskElement.style.pointerEvents = 'auto';
                }
                alert('❌ Failed to complete task. Please try again.');
            }
        }

        // Update anchor alarm button based on status
        async function updateAnchorAlarmStatus() {
            const btn = document.getElementById('anchorAlarmBtn');
            const icon = document.getElementById('anchorAlarmIcon');
            const text = document.getElementById('anchorAlarmText');

            if (!ADMIN_TOKEN) {
                // No token - show as inactive
                btn.className = 'anchor-alarm-button inactive';
                icon.textContent = '⚓';
                text.textContent = 'Anchor Alarm - Login Required';
                return;
            }

            try {
                const response = await fetch('/admin/api/anchor-watch/status', {
                    headers: {
                        'x-admin-token': ADMIN_TOKEN
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch status');
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'Unknown error');
                }

                const { active, status, distance_meters, radius_meters } = result.data;

                if (!active) {
                    // Not set
                    btn.className = 'anchor-alarm-button inactive';
                    icon.textContent = '⚓';
                    text.textContent = 'Anchor Alarm - Not Set';
                } else if (status === 'safe') {
                    // Safe
                    btn.className = 'anchor-alarm-button safe';
                    icon.textContent = '✅';
                    const distanceStr = distance_meters ? `${distance_meters.toFixed(0)}m` : 'N/A';
                    text.textContent = `Anchor Alarm - Safe (${distanceStr})`;
                } else if (status === 'warning') {
                    // Warning
                    btn.className = 'anchor-alarm-button warning';
                    icon.textContent = '⚠️';
                    const distanceStr = distance_meters ? `${distance_meters.toFixed(0)}m` : 'N/A';
                    text.textContent = `Anchor Alarm - Warning (${distanceStr})`;
                } else if (status === 'dragging') {
                    // Dragging
                    btn.className = 'anchor-alarm-button dragging';
                    icon.textContent = '🚨';
                    const distanceStr = distance_meters ? `${distance_meters.toFixed(0)}m` : 'N/A';
                    text.textContent = `ANCHOR DRAGGING! (${distanceStr})`;
                }

            } catch (error) {
                console.error('Error fetching anchor watch status:', error);
                btn.className = 'anchor-alarm-button inactive';
                icon.textContent = '⚓';
                text.textContent = 'Anchor Alarm - Error';
            }
        }

        // Load tasks when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadUserTasks();
            updateAnchorAlarmStatus();

            // Update anchor alarm status every 20 seconds
            setInterval(updateAnchorAlarmStatus, 20000);
        });
    </script>

    <!-- Mobile Navigation Component -->
    <script src="/js/mobile-nav.js"></script>
</body>
</html>
