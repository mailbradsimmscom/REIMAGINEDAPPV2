<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Planning</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --success-color: #34C759;
            --warning-color: #FF9500;
            --error-color: #FF3B30;
            --background-color: #F2F2F7;
            --surface-color: #FFFFFF;
            --card-color: #4A90D9;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --text-on-card: #FFFFFF;
            --border-color: #C6C6C8;
            --border-radius: 16px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--surface-color);
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .back-btn {
            font-size: 24px;
            text-decoration: none;
            color: var(--primary-color);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--background-color);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:disabled {
            opacity: 0.5;
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: var(--spacing-xs);
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: var(--spacing-md);
            padding-top: 75px; /* Space for fixed time nav */
            padding-bottom: 120px;
        }

        /* Time nav fixed at top below header */
        .time-nav-container {
            position: fixed;
            top: 85px; /* Below header */
            left: 0;
            right: 0;
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-sm) var(--spacing-md);
            z-index: 99;
        }

        /* Weather Card */
        .weather-card {
            background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
            border-radius: var(--border-radius);
            padding: var(--spacing-lg);
            color: var(--text-on-card);
            margin-bottom: var(--spacing-md);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .card-period {
            font-size: 24px;
            font-weight: 600;
        }

        .card-time {
            font-size: 15px;
            opacity: 0.9;
        }

        /* Metric rows */
        .metric-row {
            margin-bottom: var(--spacing-lg);
        }

        .metric-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
        }

        .metric-icon {
            font-size: 18px;
        }

        .metric-label {
            font-size: 13px;
            text-transform: uppercase;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: var(--spacing-sm);
        }

        .metric-value .direction {
            font-weight: 600;
        }

        .metric-value .range {
            opacity: 0.8;
            font-size: 15px;
        }

        .metric-value .gust {
            margin-left: var(--spacing-sm);
            padding: 2px 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 14px;
        }

        /* Source grid */
        .source-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            padding: var(--spacing-sm);
        }

        .source-grid.with-calc {
            grid-template-columns: repeat(7, 1fr);
        }

        .source-item.outlier {
            color: #FF6B6B;
        }

        .source-item.calc {
            color: #34C759;
        }

        .source-item {
            text-align: center;
            padding: var(--spacing-xs);
        }

        .source-name {
            font-size: 9px;
            opacity: 0.7;
            margin-bottom: 1px;
        }

        .source-value {
            font-size: 12px;
            font-weight: 500;
        }

        /* Simple metric (no grid) */
        .simple-metric {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .simple-metric .metric-icon {
            width: 24px;
        }

        .simple-metric .value {
            font-size: 16px;
        }

        /* Bottom Navigation (Days) */
        .bottom-nav {
            position: fixed;
            bottom: 70px; /* Above mobile nav */
            left: 0;
            right: 0;
            background: var(--surface-color);
            border-top: 1px solid var(--border-color);
            padding: var(--spacing-sm) 0;
            overflow: hidden;
        }

        .nav-row {
            display: flex;
            flex-wrap: nowrap;
            gap: var(--spacing-xs);
            overflow-x: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: var(--spacing-xs) var(--spacing-md);
            -webkit-overflow-scrolling: touch;
        }

        .nav-row::-webkit-scrollbar {
            display: none;
        }

        .nav-item {
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 16px;
            border: none;
            background: transparent;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-secondary);
        }

        .nav-item.active {
            background: var(--primary-color);
            color: white;
        }

        /* Loading & Error states */
        .loading, .error-message {
            text-align: center;
            padding: var(--spacing-lg);
        }

        .error-message {
            background: #FFE5E5;
            color: var(--error-color);
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-md);
        }

        .no-data {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-lg);
        }

    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-title">
                <a href="weather-areas.html" class="back-btn">‹</a>
                <h1 id="area-name">Loading...</h1>
            </div>
            <div class="header-actions">
                <button id="refresh-btn" class="btn-icon" onclick="refreshAll()" title="Refresh all sources">🔄</button>
            </div>
        </div>
        <div id="header-subtitle" class="header-subtitle">Loading forecast data...</div>
    </div>

    <div id="error-container" class="error-message" style="display: none;"></div>

    <div class="main-content">
        <div id="loading" class="loading">Loading weather data...</div>

        <div class="time-nav-container">
            <div id="time-nav" class="nav-row"></div>
        </div>

        <div id="weather-card-container"></div>
    </div>

    <div class="bottom-nav">
        <div id="day-nav" class="nav-row"></div>
    </div>

    <script>
        // Config
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname.startsWith('192.168')
            ? 'http://localhost:3001/api/weather'
            : 'https://boatos-maintenance.onrender.com/api/weather';

        const urlParams = new URLSearchParams(window.location.search);
        const areaId = urlParams.get('id');

        if (!areaId) {
            window.location.href = 'weather-areas.html';
        }

        // State
        let allForecasts = [];
        let selectedDay = null;
        let selectedTime = null;

        // Time blocks
        const TIME_BLOCKS = [
            { name: 'Early', label: '5am', startHour: 5, endHour: 9 },
            { name: 'Morning', label: '9am', startHour: 9, endHour: 13 },
            { name: 'Afternoon', label: '1pm', startHour: 13, endHour: 17 },
            { name: 'Evening', label: '5pm', startHour: 17, endHour: 21 },
            { name: 'Night', label: '9pm', startHour: 21, endHour: 5 }
        ];

        // Sources to show (Meteoblue marked as outlier - unreliable wave data)
        const SOURCES = [
            { key: 'open_meteo', label: 'OM' },
            { key: 'sg', label: 'SG' },
            { key: 'noaa', label: 'NOAA' },
            { key: 'ecmwf', label: 'ECMWF' },
            { key: 'meteo', label: 'MeteoFR' },
            { key: 'meteoblue', label: 'Mtblue', outlier: true }
        ];

        // Direction helpers
        function degToCompass(deg) {
            if (deg === null || deg === undefined) return '--';
            const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        // Wind conversion (km/h to knots for Open-Meteo, Stormglass is already m/s)
        function toKnots(value, source) {
            if (value === null || value === undefined) return null;
            // Open-Meteo returns km/h, Stormglass returns m/s
            if (source === 'open_meteo_forecast' || source === 'open_meteo_marine') {
                return value * 0.539957; // km/h to knots
            }
            return value * 1.94384; // m/s to knots
        }

        // Load area info
        async function loadArea() {
            try {
                const response = await fetch(`${API_BASE}/areas/${areaId}`);
                const result = await response.json();
                if (result.success) {
                    document.getElementById('area-name').textContent = result.data.name;
                }
            } catch (error) {
                console.error('Failed to load area:', error);
            }
        }

        // Load forecast data
        async function loadForecasts() {
            try {
                const response = await fetch(`${API_BASE}/areas/${areaId}/forecast`);
                const result = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (!result.success || !result.data || result.data.length === 0) {
                    document.getElementById('weather-card-container').innerHTML =
                        '<div class="no-data">No forecast data available. Click refresh to fetch.</div>';
                    return;
                }

                allForecasts = result.data;

                // Find latest fetch time
                const latestFetch = allForecasts.reduce((latest, f) => {
                    const t = new Date(f.fetched_at);
                    return t > latest ? t : latest;
                }, new Date(0));

                const ago = formatTimeAgo(latestFetch);
                document.getElementById('header-subtitle').textContent = `Updated ${ago}`;

                // Build navigation and show first card
                buildNavigation();
                renderCard();

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError(error.message);
            }
        }

        // Build day/time navigation
        function buildNavigation() {
            const days = getUniqueDays();
            const dayNav = document.getElementById('day-nav');
            const timeNav = document.getElementById('time-nav');

            // Set defaults
            if (!selectedDay && days.length > 0) {
                selectedDay = days[0];
            }
            if (!selectedTime) {
                selectedTime = TIME_BLOCKS[1]; // Morning
            }

            // Day buttons (with date number)
            dayNav.innerHTML = days.map(day => {
                const date = new Date(day + 'T12:00:00Z'); // noon UTC to avoid timezone issues
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = date.getUTCDate();
                const isActive = day === selectedDay ? 'active' : '';
                return `<button class="nav-item ${isActive}" onclick="selectDay('${day}')">${dayName} ${dayNum}</button>`;
            }).join('');

            // Time buttons
            timeNav.innerHTML = TIME_BLOCKS.map(block => {
                const isActive = block.name === selectedTime.name ? 'active' : '';
                return `<button class="nav-item ${isActive}" onclick="selectTime('${block.name}')">${block.label}</button>`;
            }).join('');
        }

        // Get unique days from forecasts
        function getUniqueDays() {
            const days = new Set();
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            allForecasts.forEach(f => {
                const date = new Date(f.forecast_time);
                if (date >= today) {
                    days.add(date.toISOString().split('T')[0]);
                }
            });

            return Array.from(days).sort().slice(0, 10); // Max 10 days
        }

        // Select day
        function selectDay(day) {
            selectedDay = day;
            buildNavigation();
            renderCard();
        }

        // Select time
        function selectTime(timeName) {
            selectedTime = TIME_BLOCKS.find(t => t.name === timeName);
            buildNavigation();
            renderCard();
        }

        // Get forecasts for selected day/time block
        function getBlockForecasts() {
            if (!selectedDay || !selectedTime) return [];

            return allForecasts.filter(f => {
                const date = new Date(f.forecast_time);
                const dateStr = date.toISOString().split('T')[0];
                const hour = date.getUTCHours();

                if (dateStr !== selectedDay) return false;

                // Handle night block wrapping
                if (selectedTime.name === 'Night') {
                    return hour >= 21 || hour < 5;
                }
                return hour >= selectedTime.startHour && hour < selectedTime.endHour;
            });
        }

        // Calculate consensus (average excluding outliers) and range
        function calculateStats(values) {
            const valid = values.filter(v => v !== null && v !== undefined && !isNaN(v));
            if (valid.length === 0) return { avg: null, min: null, max: null };

            const sorted = [...valid].sort((a, b) => a - b);
            const min = sorted[0];
            const max = sorted[sorted.length - 1];
            const avg = valid.reduce((a, b) => a + b, 0) / valid.length;

            return { avg, min, max };
        }

        // Get metric from forecasts by source
        function getMetricBySource(forecasts, field, convertFn = null) {
            const bySource = {};

            forecasts.forEach(f => {
                let sourceKey = null;

                // Map data_source + model_name to our source keys
                if (f.data_source === 'open_meteo_forecast' || f.data_source === 'open_meteo_marine') {
                    sourceKey = 'open_meteo';
                } else if (f.data_source === 'stormglass') {
                    if (f.model_name === 'sg') sourceKey = 'sg';
                    else if (f.model_name === 'noaa') sourceKey = 'noaa';
                    else if (f.model_name === 'ecmwf') sourceKey = 'ecmwf';
                    else if (f.model_name === 'meteo') sourceKey = 'meteo';
                } else if (f.data_source === 'meteoblue') {
                    sourceKey = 'meteoblue';
                }

                if (sourceKey && f[field] !== null && f[field] !== undefined) {
                    let value = f[field];
                    if (convertFn) value = convertFn(value, f.data_source);

                    if (!bySource[sourceKey]) bySource[sourceKey] = [];
                    bySource[sourceKey].push(value);
                }
            });

            // Average per source (in case multiple readings)
            const result = {};
            for (const [source, values] of Object.entries(bySource)) {
                result[source] = values.reduce((a, b) => a + b, 0) / values.length;
            }

            return result;
        }

        // Render the weather card
        function renderCard() {
            const forecasts = getBlockForecasts();
            const container = document.getElementById('weather-card-container');

            if (forecasts.length === 0) {
                container.innerHTML = '<div class="no-data">No data for this time block</div>';
                return;
            }

            // Get metrics by source
            const windBySource = getMetricBySource(forecasts, 'wind_speed_10m', toKnots);
            const gustBySource = getMetricBySource(forecasts, 'wind_gusts_10m', toKnots);
            const windDirBySource = getMetricBySource(forecasts, 'wind_direction_10m');
            const waveBySource = getMetricBySource(forecasts, 'wave_height');
            const periodBySource = getMetricBySource(forecasts, 'wave_period');
            const swellBySource = getMetricBySource(forecasts, 'swell_wave_height');
            const swellPeriodBySource = getMetricBySource(forecasts, 'swell_wave_period');
            const swellDirBySource = getMetricBySource(forecasts, 'swell_wave_direction');
            const windWaveBySource = getMetricBySource(forecasts, 'wind_wave_height');
            const rainBySource = getMetricBySource(forecasts, 'precipitation');
            const currentSpeedBySource = getMetricBySource(forecasts, 'current_speed');
            const currentDirBySource = getMetricBySource(forecasts, 'current_direction');

            // Calculate consensus (excluding meteoblue outlier for wave calcs)
            const windStats = calculateStats(Object.values(windBySource));
            const gustValues = Object.values(gustBySource);
            const maxGust = gustValues.length > 0 ? Math.max(...gustValues) : null;
            const windDir = calculateStats(Object.values(windDirBySource));
            const waveStats = calculateStats(Object.values(waveBySource));
            const periodStats = calculateStats(Object.values(periodBySource));

            // For swell and wind wave, exclude meteoblue
            const swellExclOutlier = Object.entries(swellBySource)
                .filter(([k]) => k !== 'meteoblue')
                .map(([, v]) => v);
            const windWaveExclOutlier = Object.entries(windWaveBySource)
                .filter(([k]) => k !== 'meteoblue')
                .map(([, v]) => v);

            const swellStats = calculateStats(swellExclOutlier);
            const swellPeriodStats = calculateStats(Object.values(swellPeriodBySource));
            const windWaveStats = calculateStats(windWaveExclOutlier);
            const rainStats = calculateStats(Object.values(rainBySource));

            // Calculate combined wave height: sqrt(swell^2 + wind_wave^2)
            let calculatedWaveHeight = null;
            if (swellStats.avg !== null && windWaveStats.avg !== null) {
                calculatedWaveHeight = Math.sqrt(
                    Math.pow(swellStats.avg, 2) + Math.pow(windWaveStats.avg, 2)
                );
            }

            // Current stats and relationship to swell
            const currentSpeedStats = calculateStats(Object.values(currentSpeedBySource));
            const currentDirStats = calculateStats(Object.values(currentDirBySource));
            const swellDirStats = calculateStats(Object.values(swellDirBySource));

            // Calculate current-swell relationship
            // Current direction = where it's flowing TO
            // Swell direction = where it's coming FROM, so swell travels toward (swellDir + 180)
            let currentSwellRelation = null;
            if (currentDirStats.avg !== null && swellDirStats.avg !== null) {
                const swellTravelDir = (swellDirStats.avg + 180) % 360;
                let angleDiff = Math.abs(currentDirStats.avg - swellTravelDir);
                if (angleDiff > 180) angleDiff = 360 - angleDiff;

                if (angleDiff <= 45) {
                    currentSwellRelation = { type: 'opposing', icon: '⚠️', text: 'opposing swell - steeper waves' };
                } else if (angleDiff >= 135) {
                    currentSwellRelation = { type: 'following', icon: '✓', text: 'following swell' };
                } else {
                    currentSwellRelation = { type: 'crossing', icon: '✓', text: 'crossing swell' };
                }
            }

            // Format time range
            const timeRange = `${selectedTime.startHour % 12 || 12}${selectedTime.startHour < 12 ? 'AM' : 'PM'} - ${selectedTime.endHour % 12 || 12}${selectedTime.endHour < 12 ? 'AM' : 'PM'}`;

            container.innerHTML = `
                <div class="weather-card">
                    <div class="card-header">
                        <span class="card-period">${selectedTime.name}</span>
                        <span class="card-time">${timeRange}</span>
                    </div>

                    <!-- Wind -->
                    <div class="metric-row">
                        <div class="metric-header">
                            <span class="metric-icon">💨</span>
                            <span class="metric-label">Wind</span>
                        </div>
                        <div class="metric-value">
                            <span class="direction">${degToCompass(windDir.avg)}</span>
                            ${formatValue(windStats.avg, 0)} kn
                            <span class="range">(${formatValue(windStats.min, 0)}-${formatValue(windStats.max, 0)})</span>
                            ${maxGust ? `<span class="gust">G:${formatValue(maxGust, 0)}</span>` : ''}
                        </div>
                        ${renderSourceGrid(windBySource, 0, 'kn')}
                    </div>

                    <!-- Wave Height -->
                    <div class="metric-row">
                        <div class="metric-header">
                            <span class="metric-icon">🌊</span>
                            <span class="metric-label">Wave Height</span>
                        </div>
                        <div class="metric-value">
                            <span class="direction">${degToCompass(windDir.avg)}</span>
                            ${formatValue(waveStats.avg, 1)}m
                            <span class="range">(${formatValue(waveStats.min, 1)}-${formatValue(waveStats.max, 1)})</span>
                        </div>
                        ${renderSourceGrid(waveBySource, 1, 'm', calculatedWaveHeight)}
                    </div>

                    <!-- Wave Period -->
                    <div class="metric-row">
                        <div class="metric-header">
                            <span class="metric-icon">⏱️</span>
                            <span class="metric-label">Wave Period</span>
                        </div>
                        <div class="metric-value">
                            ${formatValue(periodStats.avg, 0)}s
                            <span class="range">(${formatValue(periodStats.min, 0)}-${formatValue(periodStats.max, 0)})</span>
                        </div>
                        ${renderSourceGrid(periodBySource, 0, 's')}
                    </div>

                    <!-- Swell -->
                    <div class="simple-metric">
                        <span class="metric-icon">🌀</span>
                        <span class="value">Swell: ${formatValue(swellStats.avg, 1)}m @ ${formatValue(swellPeriodStats.avg, 0)}s</span>
                    </div>

                    <!-- Wind Wave -->
                    <div class="simple-metric">
                        <span class="metric-icon">〰️</span>
                        <span class="value">Wind Wave: ${formatValue(windWaveStats.avg, 1)}m</span>
                    </div>

                    <!-- Rain -->
                    <div class="simple-metric">
                        <span class="metric-icon">🌧️</span>
                        <span class="value">Rain: ${formatValue(rainStats.avg, 1)}mm</span>
                    </div>

                    <!-- Current -->
                    ${currentSpeedStats.avg !== null ? `
                    <div class="simple-metric">
                        <span class="metric-icon">${currentSwellRelation?.icon || '🌊'}</span>
                        <span class="value">Current: ${(currentSpeedStats.avg * 1.94384).toFixed(1)}kn ${degToCompass(currentDirStats.avg)} ${currentSwellRelation ? `(${currentSwellRelation.text})` : ''}</span>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        // Render source grid (with optional calculated value at the end)
        function renderSourceGrid(bySource, decimals, unit, calcValue = null) {
            const items = SOURCES.map(s => {
                const value = bySource[s.key];
                const outlierClass = s.outlier ? 'outlier' : '';
                return `
                    <div class="source-item ${outlierClass}">
                        <div class="source-name">${s.label}</div>
                        <div class="source-value">${formatValue(value, decimals)}${value !== null && value !== undefined ? unit : ''}</div>
                    </div>
                `;
            }).join('');

            // Add calculated column if provided
            const calcItem = calcValue !== null ? `
                <div class="source-item calc">
                    <div class="source-name">Calc</div>
                    <div class="source-value">${formatValue(calcValue, decimals)}${unit}</div>
                </div>
            ` : '';

            const gridClass = calcValue !== null ? 'source-grid with-calc' : 'source-grid';
            return `<div class="${gridClass}">${items}${calcItem}</div>`;
        }

        // Format value
        function formatValue(value, decimals) {
            if (value === null || value === undefined || isNaN(value)) return '--';
            return value.toFixed(decimals);
        }

        // Format time ago
        function formatTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            if (diffHours < 24) return `${diffHours} hr ago`;
            return `${diffDays} days ago`;
        }

        // Refresh all data sources
        async function refreshAll() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;

            document.getElementById('header-subtitle').textContent = 'Updating all sources...';

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 120000); // 120s timeout for all sources

                const response = await fetch(`${API_BASE}/areas/${areaId}/fetch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}), // Empty = all sources
                    signal: controller.signal
                });

                clearTimeout(timeout);
                const result = await response.json();

                if (!result.success && !result.partialFailure) {
                    throw new Error(result.error || 'Failed to update');
                }

                // Show result message briefly
                if (result.partialFailure) {
                    showError(result.message);
                }

                // Reload forecasts
                await loadForecasts();

            } catch (error) {
                if (error.name === 'AbortError') {
                    showError('Request timed out. The server may be slow - try again.');
                } else {
                    showError(error.message);
                }
                document.getElementById('header-subtitle').textContent = 'Update failed';
            } finally {
                btn.disabled = false;
            }
        }

        // Show error
        function showError(message) {
            const container = document.getElementById('error-container');
            container.textContent = message;
            container.style.display = 'block';
            setTimeout(() => { container.style.display = 'none'; }, 5000);
        }

        // Initialize
        loadArea();
        loadForecasts();
    </script>

    <script src="/public/js/mobile-nav.js"></script>
</body>
