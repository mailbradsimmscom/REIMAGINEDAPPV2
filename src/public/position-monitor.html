<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Monitor</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --success-color: #34C759;
            --error-color: #FF3B30;
            --background-color: #F2F2F7;
            --surface-color: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --border-color: #C6C6C8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 12px;
        }

        .status-indicator.green {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success-color);
        }

        .status-indicator.red {
            background: rgba(255, 59, 48, 0.15);
            color: var(--error-color);
        }

        .status-indicator.neutral {
            background: rgba(142, 142, 147, 0.15);
            color: var(--text-secondary);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .status-indicator.green .status-dot { background: var(--success-color); }
        .status-indicator.red .status-dot { background: var(--error-color); }
        .status-indicator.neutral .status-dot { background: var(--text-secondary); }

        .card {
            background: var(--surface-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .position-display {
            text-align: center;
        }

        .position-line {
            font-size: 28px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', SFMono-Regular, Consolas, monospace;
            margin-bottom: 8px;
        }

        .position-line.less { color: var(--primary-color); }
        .position-line.more { color: #FF9500; }

        .position-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .position-timestamp {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .ddm-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .ddm-input-row label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            width: 30px;
        }

        .direction-select {
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--surface-color);
            width: 60px;
            text-align: center;
        }

        .degrees-input {
            padding: 12px;
            font-size: 18px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--surface-color);
            width: 70px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .minutes-input {
            padding: 12px;
            font-size: 18px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--surface-color);
            width: 110px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .ddm-symbol {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: var(--background-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .expectation-toggle {
            display: flex;
            background: var(--background-color);
            border-radius: 12px;
            padding: 4px;
        }

        .expectation-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .expectation-btn.active {
            background: var(--surface-color);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .comparison-item {
            text-align: center;
        }

        .comparison-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .comparison-value {
            font-size: 16px;
            font-weight: 600;
        }

        .comparison-value.match { color: var(--success-color); }
        .comparison-value.mismatch { color: var(--error-color); }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
        }
    </style>
</head>
<body>
    <a href="/public/unified-mobile.html" class="back-link">← Back</a>

    <div class="header">
        <h1>Position Monitor</h1>
        <div id="statusIndicator" class="status-indicator neutral">
            <div class="status-dot"></div>
            <span id="statusText">No Reference Set</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Current Position</div>
        <div class="position-display">
            <div class="position-label">Latitude</div>
            <div class="position-line" id="currentLat">N --°--.---'</div>
            <div class="position-label">Longitude</div>
            <div class="position-line" id="currentLon">W --°--.---'</div>
            <div class="position-timestamp" id="positionTimestamp">Last update: --</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Reference Position</div>
        <div class="ddm-input-row">
            <label>Lat</label>
            <select class="direction-select" id="refLatDir">
                <option value="N">N</option>
                <option value="S">S</option>
            </select>
            <input type="number" class="degrees-input" id="refLatDeg" placeholder="13" min="0" max="90">
            <span class="ddm-symbol">°</span>
            <input type="number" class="minutes-input" id="refLatMin" placeholder="17.775" step="0.001" min="0" max="59.999">
            <span class="ddm-symbol">'</span>
        </div>
        <div class="ddm-input-row">
            <label>Lon</label>
            <select class="direction-select" id="refLonDir">
                <option value="E">E</option>
                <option value="W" selected>W</option>
            </select>
            <input type="number" class="degrees-input" id="refLonDeg" placeholder="61" min="0" max="180">
            <span class="ddm-symbol">°</span>
            <input type="number" class="minutes-input" id="refLonMin" placeholder="14.135" step="0.001" min="0" max="59.999">
            <span class="ddm-symbol">'</span>
        </div>
        <div class="button-row">
            <button type="button" class="btn btn-secondary" id="fillCurrentBtn">Fill Current</button>
            <button type="button" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Expectation</div>
        <div class="expectation-toggle">
            <button type="button" class="expectation-btn active" id="expectLess" data-expect="less">Less</button>
            <button type="button" class="expectation-btn" id="expectMore" data-expect="more">More</button>
        </div>
        <div class="comparison" id="comparisonSection" style="display: none;">
            <div class="comparison-item">
                <div class="comparison-label">Lat vs Ref</div>
                <div class="comparison-value" id="latComparison">--</div>
            </div>
            <div class="comparison-item">
                <div class="comparison-label">Lon vs Ref</div>
                <div class="comparison-value" id="lonComparison">--</div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentPosition = { lat: null, lon: null, timestamp: null };
        let referencePosition = { lat: null, lon: null };
        let expectation = 'less';
        let pollInterval = null;

        // DOM elements
        const currentLatEl = document.getElementById('currentLat');
        const currentLonEl = document.getElementById('currentLon');
        const positionTimestampEl = document.getElementById('positionTimestamp');
        const refLatDir = document.getElementById('refLatDir');
        const refLatDeg = document.getElementById('refLatDeg');
        const refLatMin = document.getElementById('refLatMin');
        const refLonDir = document.getElementById('refLonDir');
        const refLonDeg = document.getElementById('refLonDeg');
        const refLonMin = document.getElementById('refLonMin');
        const fillCurrentBtn = document.getElementById('fillCurrentBtn');
        const saveBtn = document.getElementById('saveBtn');
        const expectLessBtn = document.getElementById('expectLess');
        const expectMoreBtn = document.getElementById('expectMore');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const comparisonSection = document.getElementById('comparisonSection');
        const latComparison = document.getElementById('latComparison');
        const lonComparison = document.getElementById('lonComparison');

        /**
         * Convert decimal degrees to DDM components
         */
        function decimalToDDM(decimal, isLat) {
            const abs = Math.abs(decimal);
            const degrees = Math.floor(abs);
            const minutes = (abs - degrees) * 60;
            let direction;
            if (isLat) {
                direction = decimal >= 0 ? 'N' : 'S';
            } else {
                direction = decimal >= 0 ? 'E' : 'W';
            }
            return { direction, degrees, minutes };
        }

        /**
         * Convert DDM to decimal degrees
         */
        function ddmToDecimal(direction, degrees, minutes) {
            const decimal = parseFloat(degrees) + parseFloat(minutes) / 60;
            if (direction === 'S' || direction === 'W') {
                return -decimal;
            }
            return decimal;
        }

        /**
         * Format decimal degrees as DDM string
         */
        function toDDM(decimal, isLat) {
            if (decimal === null || decimal === undefined || isNaN(decimal)) {
                return isLat ? "N --°--.---'" : "W --°--.---'";
            }
            const { direction, degrees, minutes } = decimalToDDM(decimal, isLat);
            return `${direction} ${degrees}°${minutes.toFixed(3)}'`;
        }

        // Load saved state from localStorage
        function loadState() {
            const saved = localStorage.getItem('positionMonitor');
            if (saved) {
                const state = JSON.parse(saved);
                referencePosition = state.reference || { lat: null, lon: null };
                expectation = state.expectation || 'less';

                if (referencePosition.lat !== null) {
                    const latDDM = decimalToDDM(referencePosition.lat, true);
                    refLatDir.value = latDDM.direction;
                    refLatDeg.value = latDDM.degrees;
                    refLatMin.value = latDDM.minutes.toFixed(3);

                    const lonDDM = decimalToDDM(referencePosition.lon, false);
                    refLonDir.value = lonDDM.direction;
                    refLonDeg.value = lonDDM.degrees;
                    refLonMin.value = lonDDM.minutes.toFixed(3);
                }

                updateExpectationUI();
            }
        }

        // Save state to localStorage
        function saveState() {
            localStorage.setItem('positionMonitor', JSON.stringify({
                reference: referencePosition,
                expectation: expectation
            }));
        }

        // Fetch current GPS position from API
        async function fetchGpsPosition() {
            try {
                const response = await fetch('/api/gps/current');
                const result = await response.json();

                if (result.success && result.data) {
                    currentPosition.lat = result.data.latitude;
                    currentPosition.lon = result.data.longitude;
                    currentPosition.timestamp = result.data.timestamp;
                    updatePositionDisplay();
                } else {
                    currentLatEl.textContent = "N --°--.---'";
                    currentLonEl.textContent = "W --°--.---'";
                    positionTimestampEl.textContent = 'No GPS data available';
                }
            } catch (error) {
                console.error('Error fetching GPS position:', error);
                currentLatEl.textContent = 'Error';
                currentLonEl.textContent = 'Error';
                positionTimestampEl.textContent = 'Connection error';
            }
        }

        // Update position display
        function updatePositionDisplay() {
            if (currentPosition.lat !== null) {
                currentLatEl.textContent = toDDM(currentPosition.lat, true);
                currentLonEl.textContent = toDDM(currentPosition.lon, false);

                if (currentPosition.timestamp) {
                    const ts = new Date(currentPosition.timestamp);
                    positionTimestampEl.textContent = `Last update: ${ts.toLocaleTimeString()}`;
                }
            }
            updateStatus();
        }

        // Update expectation UI
        function updateExpectationUI() {
            expectLessBtn.classList.toggle('active', expectation === 'less');
            expectMoreBtn.classList.toggle('active', expectation === 'more');
        }

        // Update status indicator and comparison
        function updateStatus() {
            if (referencePosition.lat === null || currentPosition.lat === null) {
                statusIndicator.className = 'status-indicator neutral';
                statusText.textContent = 'No Reference Set';
                comparisonSection.style.display = 'none';
                currentLatEl.className = 'position-line';
                currentLonEl.className = 'position-line';
                return;
            }

            comparisonSection.style.display = 'grid';

            const latDiff = currentPosition.lat - referencePosition.lat;
            const lonDiff = currentPosition.lon - referencePosition.lon;

            const latIsLess = latDiff < 0;
            const lonIsLess = lonDiff < 0;

            // Update comparison display
            latComparison.textContent = latIsLess ? 'Less' : 'More';
            lonComparison.textContent = lonIsLess ? 'Less' : 'More';

            // Check if both match expectation
            let latMatches, lonMatches;
            if (expectation === 'less') {
                latMatches = latIsLess;
                lonMatches = lonIsLess;
            } else {
                latMatches = !latIsLess;
                lonMatches = !lonIsLess;
            }

            latComparison.className = 'comparison-value ' + (latMatches ? 'match' : 'mismatch');
            lonComparison.className = 'comparison-value ' + (lonMatches ? 'match' : 'mismatch');

            // Update current position styling
            currentLatEl.className = 'position-line ' + (latIsLess ? 'less' : 'more');
            currentLonEl.className = 'position-line ' + (lonIsLess ? 'less' : 'more');

            // Overall status
            if (latMatches && lonMatches) {
                statusIndicator.className = 'status-indicator green';
                statusText.textContent = 'Both ' + (expectation === 'less' ? 'Less' : 'More');
            } else {
                statusIndicator.className = 'status-indicator red';
                statusText.textContent = 'Mismatch';
            }
        }

        // Start polling for GPS position
        function startPolling() {
            fetchGpsPosition();
            pollInterval = setInterval(fetchGpsPosition, 5000);
        }

        // Event listeners
        fillCurrentBtn.addEventListener('click', () => {
            if (currentPosition.lat !== null) {
                const latDDM = decimalToDDM(currentPosition.lat, true);
                refLatDir.value = latDDM.direction;
                refLatDeg.value = latDDM.degrees;
                refLatMin.value = latDDM.minutes.toFixed(3);

                const lonDDM = decimalToDDM(currentPosition.lon, false);
                refLonDir.value = lonDDM.direction;
                refLonDeg.value = lonDDM.degrees;
                refLonMin.value = lonDDM.minutes.toFixed(3);
            }
        });

        saveBtn.addEventListener('click', () => {
            const latDeg = parseFloat(refLatDeg.value);
            const latMin = parseFloat(refLatMin.value);
            const lonDeg = parseFloat(refLonDeg.value);
            const lonMin = parseFloat(refLonMin.value);

            if (!isNaN(latDeg) && !isNaN(latMin) && !isNaN(lonDeg) && !isNaN(lonMin)) {
                referencePosition.lat = ddmToDecimal(refLatDir.value, latDeg, latMin);
                referencePosition.lon = ddmToDecimal(refLonDir.value, lonDeg, lonMin);
                saveState();
                updateStatus();
            }
        });

        expectLessBtn.addEventListener('click', () => {
            expectation = 'less';
            updateExpectationUI();
            saveState();
            updateStatus();
        });

        expectMoreBtn.addEventListener('click', () => {
            expectation = 'more';
            updateExpectationUI();
            saveState();
            updateStatus();
        });

        // Initialize
        loadState();
        startPolling();
    </script>

    <!-- Mobile Navigation Component -->
    <script src="/public/js/mobile-nav.js"></script>
</body>
</html>
