<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Chat - Mobile</title>
    <link rel="stylesheet" href="/public/chat-styles.css" />
    <style>
      /* Mobile-specific overrides */
      body {
        padding: 0;
        margin: 0;
        overscroll-behavior: none;
      }

      /* Hide stats panel completely on mobile */
      .stats-panel,
      .toggle-stats-btn,
      #toggleStatsBtn {
        display: none !important;
      }

      .chat.show-stats .stats-panel {
        display: none !important;
      }

      .chat.show-stats .messages {
        margin-right: 0 !important;
      }

      /* Full screen layout */
      .app {
        height: 100vh;
        height: 100dvh; /* Dynamic viewport height for mobile */
        display: flex;
        flex-direction: column;
      }

      /* Mobile header with hamburger */
      .header {
        padding: max(env(safe-area-inset-top), 16px) 16px 16px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .hamburger-btn {
        background: none;
        border: none;
        padding: 8px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 1001;
      }

      .hamburger-btn span {
        width: 24px;
        height: 3px;
        background: var(--text-primary);
        border-radius: 2px;
        transition: all 0.3s ease;
      }

      .hamburger-btn.open span:nth-child(1) {
        transform: rotate(45deg) translate(6px, 6px);
      }

      .hamburger-btn.open span:nth-child(2) {
        opacity: 0;
      }

      .hamburger-btn.open span:nth-child(3) {
        transform: rotate(-45deg) translate(6px, -6px);
      }

      .home-btn {
        background: none;
        border: none;
        padding: 8px;
        cursor: pointer;
        font-size: 24px;
        line-height: 1;
        z-index: 1001;
        transition: transform 0.2s;
      }

      .home-btn:active {
        transform: scale(0.9);
      }

      .header-content {
        flex: 1;
        margin-left: 12px;
      }

      .title {
        font-size: 18px;
      }

      .subtitle {
        font-size: 12px;
      }

      /* Mobile sidebar - overlay from left */
      .layout {
        display: flex;
        flex-direction: row;
        flex: 1;
        min-height: 0;
        position: relative;
      }

      .sidebar {
        position: fixed;
        left: -100%;
        top: 0;
        bottom: 0;
        width: 280px;
        max-width: 85vw;
        z-index: 1000;
        transition: left 0.3s ease;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0);
      }

      .sidebar.open {
        left: 0;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
      }

      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        display: none;
        transition: opacity 0.3s ease;
      }

      .sidebar-overlay.show {
        display: block;
      }

      /* Chat area takes full width */
      .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 0;
      }

      .chat-header {
        display: none;
      }

      /* Messages area */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        margin: 0;
        max-width: 100%;
        -webkit-overflow-scrolling: touch;
      }

      .message-bubble {
        max-width: 90%;
        font-size: 16px; /* Prevents iOS zoom */
      }

      .bubble {
        max-width: 90%;
      }

      /* Composer - sticky bottom with safe area */
      .composer {
        padding: 12px 16px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        flex-shrink: 0;
      }

      .input-container {
        display: flex;
        gap: 8px;
        max-width: 100%;
        margin: 0;
      }

      #messageInput {
        flex: 1;
        padding: 12px 16px;
        font-size: 16px; /* Prevents iOS zoom */
        border-radius: 20px;
        min-height: 44px; /* Touch target size */
      }

      #sendBtn {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }

      /* Model selector - mobile optimized */
      .model-selector {
        margin-bottom: 12px;
      }

      .model-select {
        font-size: 14px;
        padding: 10px;
        min-height: 44px; /* Touch target */
      }

      /* New chat button */
      .new-chat {
        padding: 12px 16px;
        font-size: 16px;
        min-height: 44px;
      }

      /* Chat list items - touch friendly */
      .chat-item {
        padding: 16px;
        margin-bottom: 8px;
        min-height: 60px;
      }

      .chat-name {
        font-size: 16px;
      }

      .chat-sub {
        font-size: 14px;
      }

      .delete-chat-btn {
        min-width: 44px;
        min-height: 44px;
      }

      /* Empty state */
      .empty-state {
        padding: 32px 16px;
      }

      .empty-state-icon {
        font-size: 40px;
      }

      .empty-state-title {
        font-size: 20px;
      }

      .empty-state-subtitle {
        font-size: 14px;
      }

      /* Source bubbles - larger tap targets */
      .source-bubble {
        min-width: 32px;
        height: 32px;
        font-size: 13px;
      }

      /* Source modal - full screen on mobile */
      .source-modal-content {
        max-width: 95vw;
        max-height: 90vh;
        margin: 20px;
      }

      /* Loading indicator */
      .typing-indicator {
        padding: 12px;
      }

      /* Scrollbar - thinner on mobile */
      ::-webkit-scrollbar {
        width: 4px;
      }

      /* Landscape adjustments */
      @media (orientation: landscape) and (max-height: 500px) {
        .header {
          padding: 12px 16px;
        }

        .empty-state {
          padding: 24px 16px;
        }

        .empty-state-icon {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Mobile Header with Hamburger -->
      <header class="header">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="header-content">
          <div class="title">Chat</div>
          <div class="subtitle" id="headerSubtitle">Connected</div>
        </div>
        <button class="home-btn" id="homeBtn" aria-label="Go to home">🏠</button>
      </header>

      <!-- Sidebar Overlay -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <main class="layout">
        <!-- Sidebar (slides in from left) -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title">Chat Sessions</div>

            <!-- Model Selection Toggle -->
            <div class="model-selector">
              <label for="modelSelect" class="model-label">Synthesis Model</label>
              <select id="modelSelect" class="model-select">
                <option value="gpt-5">GPT-5 (Detailed, ~60s)</option>
                <option value="gpt-4.1-mini">GPT-4.1-mini (Fast, ~9s)</option>
              </select>
            </div>

            <button class="new-chat" id="newChatBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              New Chat
            </button>
          </div>
          <div class="chat-list" id="chatList">
            <!-- Chat sessions will be loaded here dynamically -->
          </div>
        </aside>

        <!-- Chat Area -->
        <section class="chat" id="chatSection">
          <div class="messages" id="messages">
            <div class="empty-state">
              <div class="empty-state-icon">💬</div>
              <div class="empty-state-title">Start a conversation</div>
              <div class="empty-state-subtitle">Type a message below</div>
            </div>
          </div>

          <footer class="composer">
            <div class="input-container">
              <input
                id="messageInput"
                type="text"
                placeholder="Ask about systems..."
                autocomplete="off"
              />
              <button id="sendBtn" aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
              </button>
            </div>
          </footer>
        </section>
      </main>
    </div>

    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script type="module" src="/app.js"></script>
    <script>
      // Mobile-specific: Hamburger menu toggle
      document.addEventListener('DOMContentLoaded', () => {
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const homeBtn = document.getElementById('homeBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        // Home button - navigate to unified mobile dashboard
        homeBtn.addEventListener('click', () => {
          window.location.href = '/public/unified-mobile.html';
        });

        function openSidebar() {
          sidebar.classList.add('open');
          sidebarOverlay.classList.add('show');
          hamburgerBtn.classList.add('open');
          document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('show');
          hamburgerBtn.classList.remove('open');
          document.body.style.overflow = '';
        }

        hamburgerBtn.addEventListener('click', () => {
          if (sidebar.classList.contains('open')) {
            closeSidebar();
          } else {
            openSidebar();
          }
        });

        sidebarOverlay.addEventListener('click', closeSidebar);

        // Close sidebar when selecting a chat
        const chatList = document.getElementById('chatList');
        if (chatList) {
          chatList.addEventListener('click', (e) => {
            if (e.target.closest('.chat-item')) {
              closeSidebar();
            }
          });
        }

        // Close sidebar when creating new chat
        const newChatBtn = document.getElementById('newChatBtn');
        if (newChatBtn) {
          newChatBtn.addEventListener('click', () => {
            closeSidebar();
          });
        }
      });
    </script>
  </body>
</html>
