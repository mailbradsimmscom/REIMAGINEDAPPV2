<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Current - BoatOS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #F2F2F7;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .header {
            background: white;
            padding: max(env(safe-area-inset-top), 16px) 16px 16px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #007AFF;
            font-size: 20px;
            transition: background 0.2s;
        }

        .back-button:active {
            background: #E5E5EA;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #000;
        }

        .location-name {
            font-size: 14px;
            color: #8E8E93;
            margin-left: auto;
        }

        .section {
            padding: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #8E8E93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .weather-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .weather-item {
            text-align: center;
            padding: 12px;
            background: #F8F8F8;
            border-radius: 8px;
        }

        .weather-value {
            font-size: 24px;
            font-weight: 600;
            color: #000;
        }

        .weather-unit {
            font-size: 14px;
            color: #8E8E93;
        }

        .weather-label {
            font-size: 12px;
            color: #8E8E93;
            margin-top: 4px;
        }

        .weather-direction {
            font-size: 14px;
            color: #007AFF;
            margin-top: 2px;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #000;
            margin-bottom: 12px;
        }

        .chart-container {
            position: relative;
            height: 200px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: #8E8E93;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #E5E5EA;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #FFE5E5;
            color: #FF3B30;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .position-info {
            font-size: 12px;
            color: #8E8E93;
            text-align: center;
            margin-top: 8px;
        }

        .conditions-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #E5E5EA;
        }

        .condition-badge {
            background: #E5F3FF;
            color: #007AFF;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
        }

        .movement-stats {
            background: #FFF8E5;
            border: 1px solid #FFD60A;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            text-align: center;
        }

        .movement-stats .label {
            font-size: 12px;
            color: #8E8E93;
            margin-bottom: 4px;
        }

        .movement-stats .value {
            font-size: 18px;
            font-weight: 600;
            color: #FF9500;
        }

        .section:last-child {
            padding-bottom: 100px;
        }

        .hour-pill {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            background: #E5E5EA;
            color: #8E8E93;
            transition: background 0.2s, color 0.2s;
        }

        .hour-pill.active {
            background: #007AFF;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/public/unified-mobile.html" class="back-button">←</a>
        <h1>Current</h1>
        <span class="location-name" id="location-name">Loading...</span>
    </div>

    <div id="content">
        <div class="loading">
            <div class="spinner"></div>
            <span>Loading boat status...</span>
        </div>
    </div>

    <!-- Mobile Navigation Components -->
    <script src="/public/js/mobile-hamburger.js"></script>
    <script src="/public/js/mobile-nav.js"></script>

    <script>
        // Load data on page load
        document.addEventListener('DOMContentLoaded', loadBoatStatus);

        // Event delegation for hours picker
        document.addEventListener('click', (e) => {
            const pill = e.target.closest('.hour-pill');
            if (pill) reloadHistory(parseInt(pill.dataset.hours));
        });

        async function loadBoatStatus() {
            const contentDiv = document.getElementById('content');

            try {
                const response = await fetch('/api/boat-now?hours=5');
                const result = await response.json();

                if (!result.success || !result.data.hasData) {
                    contentDiv.innerHTML = `<div class="section"><div class="error">No GPS data available</div></div>`;
                    return;
                }

                const { current, history } = result.data;

                // Update location name in header
                document.getElementById('location-name').textContent = current.placeName;

                // Render the page
                contentDiv.innerHTML = renderContent(current, history);

                // Initialize charts after DOM is ready
                setTimeout(() => {
                    initCharts(history.data);
                }, 100);

            } catch (error) {
                console.error('Error loading boat status:', error);
                contentDiv.innerHTML = `<div class="section"><div class="error">Error: ${error.message}</div></div>`;
            }
        }

        function renderContent(current, history) {
            const weather = current.weather || {};
            const pos = current.position;

            return `
                <div class="section">
                    <div class="section-title">Current Conditions</div>
                    <div class="weather-card">
                        <div class="weather-grid">
                            <div class="weather-item">
                                <div class="weather-value">${weather.temperature_c !== null ? weather.temperature_c.toFixed(1) : '--'}<span class="weather-unit">°C</span></div>
                                <div class="weather-label">Temperature</div>
                            </div>
                            <div class="weather-item">
                                <div class="weather-value">${weather.wind_speed_kts !== null ? weather.wind_speed_kts.toFixed(1) : '--'}<span class="weather-unit">kts</span></div>
                                <div class="weather-label">Wind Speed</div>
                                <div class="weather-direction">${weather.wind_direction_compass || '--'} (${weather.wind_direction !== null ? weather.wind_direction + '°' : '--'})</div>
                            </div>
                            <div class="weather-item">
                                <div class="weather-value">${weather.wave_height_m !== null ? weather.wave_height_m.toFixed(1) : '--'}<span class="weather-unit">m</span></div>
                                <div class="weather-label">Wave Height</div>
                                <div class="weather-direction">${weather.wave_direction_compass || '--'} (${weather.wave_direction !== null ? weather.wave_direction + '°' : '--'})</div>
                            </div>
                            <div class="weather-item">
                                <div class="weather-value">${weather.precipitation_mm !== null ? weather.precipitation_mm.toFixed(1) : '--'}<span class="weather-unit">mm</span></div>
                                <div class="weather-label">Precipitation</div>
                            </div>
                        </div>
                        <div class="conditions-row">
                            <span class="condition-badge">${weather.weather_description || 'Unknown'}</span>
                            ${weather.wind_gusts_kts ? `<span class="condition-badge">Gusts ${weather.wind_gusts_kts.toFixed(0)} kts</span>` : ''}
                        </div>
                        <div class="position-info">
                            Position: ${pos.latitude.toFixed(5)}, ${pos.longitude.toFixed(5)} |
                            Updated: ${new Date(pos.timestamp).toLocaleTimeString()}
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                        <div class="section-title" id="historyTitle" style="margin-bottom:0">Last ${history.hoursBack} Hours (${history.pointCount} readings)</div>
                        <div style="display:flex;gap:6px;" id="hoursPicker">
                            <button class="hour-pill${history.hoursBack === 5 ? ' active' : ''}" data-hours="5">5h</button>
                            <button class="hour-pill${history.hoursBack === 12 ? ' active' : ''}" data-hours="12">12h</button>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">Wind Speed (knots)</div>
                        <div class="chart-container">
                            <canvas id="windSpeedChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">Wind Direction (degrees)</div>
                        <div class="chart-container">
                            <canvas id="windDirectionChart"></canvas>
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-title">Position Track (5 hours)</div>
                        <div class="chart-container" id="positionMap" style="z-index: 1;"></div>
                        <div class="movement-stats" id="movementStats">
                            <div class="label">Movement Radius</div>
                            <div class="value">Calculating...</div>
                        </div>
                    </div>
                </div>
            `;
        }

        let windSpeedChart = null;
        let windDirChart = null;

        async function reloadHistory(hours) {
            // Update pills
            document.querySelectorAll('.hour-pill').forEach(p => p.classList.remove('active'));
            document.querySelector(`.hour-pill[data-hours="${hours}"]`).classList.add('active');
            document.getElementById('historyTitle').textContent = 'Loading...';

            try {
                const response = await fetch(`/api/boat-now/history?hours=${hours}`);
                const result = await response.json();
                if (result.success && result.data.pointCount > 0) {
                    const history = result.data;
                    document.getElementById('historyTitle').textContent =
                        `Last ${history.hoursBack} Hours (${history.pointCount} readings)`;

                    // Destroy existing charts
                    if (windSpeedChart) { windSpeedChart.destroy(); windSpeedChart = null; }
                    if (windDirChart) { windDirChart.destroy(); windDirChart = null; }

                    initCharts(history.data);
                } else {
                    document.getElementById('historyTitle').textContent = 'No data for this period';
                }
            } catch (error) {
                console.error('Error reloading history:', error);
                document.getElementById('historyTitle').textContent = 'Error loading data';
            }
        }

        function initCharts(data) {
            const timestamps = data.timestamps.map(t => new Date(t));

            // Calculate dynamic min/max with padding
            function getAxisRange(values, padding = 0.1) {
                const validValues = values.filter(v => v !== null && v !== undefined);
                if (validValues.length === 0) return { min: 0, max: 100 };

                const min = Math.min(...validValues);
                const max = Math.max(...validValues);
                const range = max - min || 1; // Avoid divide by zero
                const pad = range * padding;

                return {
                    min: Math.floor(min - pad),
                    max: Math.ceil(max + pad)
                };
            }

            // Calculate average
            function getAverage(values) {
                const validValues = values.filter(v => v !== null && v !== undefined);
                if (validValues.length === 0) return null;
                return validValues.reduce((a, b) => a + b, 0) / validValues.length;
            }

            // Linear regression for trend line
            function linearRegression(values) {
                const valid = values.map((v, i) => [i, v]).filter(([, v]) => v !== null && v !== undefined);
                if (valid.length < 2) return null;
                const n = valid.length;
                const sumX = valid.reduce((s, [x]) => s + x, 0);
                const sumY = valid.reduce((s, [, y]) => s + y, 0);
                const sumXY = valid.reduce((s, [x, y]) => s + x * y, 0);
                const sumX2 = valid.reduce((s, [x]) => s + x * x, 0);
                const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;
                return { start: intercept, end: intercept + slope * (values.length - 1), slope };
            }

            // Build trend dataset (straight line from first to last point)
            function trendDataset(values, trend) {
                if (!trend) return null;
                const trendData = new Array(values.length).fill(null);
                trendData[0] = trend.start;
                trendData[trendData.length - 1] = trend.end;
                return {
                    data: trendData,
                    borderColor: 'rgba(255, 59, 48, 0.5)',
                    borderWidth: 2,
                    borderDash: [4, 4],
                    pointRadius: 0,
                    fill: false,
                    tension: 0,
                    spanGaps: true
                };
            }

            // Format trend label
            function trendLabel(trend, unit) {
                if (!trend) return '';
                const change = trend.end - trend.start;
                const arrow = change >= 0 ? '↑' : '↓';
                return `${arrow} ${change >= 0 ? '+' : ''}${change.toFixed(1)}${unit}`;
            }

            const windSpeedRange = getAxisRange(data.windSpeed);
            const windDirRange = getAxisRange(data.windDirection);
            const windSpeedAvg = getAverage(data.windSpeed);
            const windDirAvg = getAverage(data.windDirection);
            const windSpeedTrend = linearRegression(data.windSpeed);
            const windDirTrend = linearRegression(data.windDirection);

            // Common chart options
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            displayFormats: {
                                hour: 'HH:mm'
                            }
                        },
                        grid: { display: false }
                    },
                    y: {
                        grid: { color: '#F0F0F0' }
                    }
                }
            };

            // Wind Speed Chart (dynamic Y-axis with average + trend lines)
            const windSpeedDatasets = [{
                data: data.windSpeed,
                borderColor: '#007AFF',
                backgroundColor: 'rgba(0, 122, 255, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 0
            }];
            const windSpeedTrendDs = trendDataset(data.windSpeed, windSpeedTrend);
            if (windSpeedTrendDs) windSpeedDatasets.push(windSpeedTrendDs);

            windSpeedChart = new Chart(document.getElementById('windSpeedChart'), {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: windSpeedDatasets
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        annotation: {
                            annotations: {
                                averageLine: {
                                    type: 'line',
                                    yMin: windSpeedAvg,
                                    yMax: windSpeedAvg,
                                    borderColor: '#FF9500',
                                    borderWidth: 2,
                                    borderDash: [6, 4],
                                    label: {
                                        display: true,
                                        content: `Avg: ${windSpeedAvg?.toFixed(1)} kts`,
                                        position: 'end',
                                        backgroundColor: '#FF9500',
                                        color: '#fff',
                                        font: { size: 11 }
                                    }
                                },
                                ...(windSpeedTrend ? {
                                    trendLabel: {
                                        type: 'label',
                                        xValue: timestamps[0],
                                        yValue: windSpeedTrend.start,
                                        content: trendLabel(windSpeedTrend, ' kts'),
                                        backgroundColor: 'rgba(255, 59, 48, 0.7)',
                                        color: '#fff',
                                        font: { size: 10 },
                                        position: 'start'
                                    }
                                } : {})
                            }
                        }
                    },
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            ...commonOptions.scales.y,
                            title: { display: true, text: 'knots' },
                            min: Math.max(0, windSpeedRange.min),
                            max: windSpeedRange.max
                        }
                    }
                }
            });

            // Wind Direction Chart (dynamic Y-axis with average + trend lines)
            const windDirDatasets = [{
                data: data.windDirection,
                borderColor: '#34C759',
                backgroundColor: 'rgba(52, 199, 89, 0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 0
            }];
            const windDirTrendDs = trendDataset(data.windDirection, windDirTrend);
            if (windDirTrendDs) windDirDatasets.push(windDirTrendDs);

            windDirChart = new Chart(document.getElementById('windDirectionChart'), {
                type: 'line',
                data: {
                    labels: timestamps,
                    datasets: windDirDatasets
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        annotation: {
                            annotations: {
                                averageLine: {
                                    type: 'line',
                                    yMin: windDirAvg,
                                    yMax: windDirAvg,
                                    borderColor: '#FF9500',
                                    borderWidth: 2,
                                    borderDash: [6, 4],
                                    label: {
                                        display: true,
                                        content: `Avg: ${windDirAvg?.toFixed(0)}°`,
                                        position: 'end',
                                        backgroundColor: '#FF9500',
                                        color: '#fff',
                                        font: { size: 11 }
                                    }
                                },
                                ...(windDirTrend ? {
                                    trendLabel: {
                                        type: 'label',
                                        xValue: timestamps[0],
                                        yValue: windDirTrend.start,
                                        content: trendLabel(windDirTrend, '°'),
                                        backgroundColor: 'rgba(255, 59, 48, 0.7)',
                                        color: '#fff',
                                        font: { size: 10 },
                                        position: 'start'
                                    }
                                } : {})
                            }
                        }
                    },
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            ...commonOptions.scales.y,
                            title: { display: true, text: 'degrees' },
                            min: Math.max(0, windDirRange.min),
                            max: Math.min(360, windDirRange.max)
                        }
                    }
                }
            });

            // Position Map with Leaflet
            initPositionMap(data);
        }

        function initPositionMap(data) {
            // Build array of valid coordinates
            const coords = [];
            for (let i = 0; i < data.latitude.length; i++) {
                const lat = data.latitude[i];
                const lon = data.longitude[i];
                if (lat !== null && lon !== null) {
                    coords.push([lat, lon]);
                }
            }

            if (coords.length === 0) {
                document.getElementById('positionMap').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8E8E93;">No position data</div>';
                document.getElementById('movementStats').innerHTML = '<div class="label">No position data</div>';
                return;
            }

            // Calculate centroid
            const centroid = coords.reduce(
                (acc, coord) => [acc[0] + coord[0] / coords.length, acc[1] + coord[1] / coords.length],
                [0, 0]
            );

            // Calculate max distance from centroid (movement radius)
            function haversineDistance(lat1, lon1, lat2, lon2) {
                const R = 6371000; // Earth's radius in meters
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }

            // Find max distance from centroid
            let maxRadius = 0;
            let farthestPoint = coords[0];
            coords.forEach(coord => {
                const dist = haversineDistance(centroid[0], centroid[1], coord[0], coord[1]);
                if (dist > maxRadius) {
                    maxRadius = dist;
                    farthestPoint = coord;
                }
            });

            // Update movement stats display
            const statsDiv = document.getElementById('movementStats');
            let radiusDisplay;
            if (maxRadius < 1) {
                radiusDisplay = `${(maxRadius * 100).toFixed(1)} cm`;
            } else if (maxRadius < 100) {
                radiusDisplay = `${maxRadius.toFixed(1)} m`;
            } else {
                radiusDisplay = `${(maxRadius / 1000).toFixed(2)} km`;
            }
            statsDiv.innerHTML = `
                <div class="label">Movement Radius (5 hours)</div>
                <div class="value">${radiusDisplay}</div>
            `;

            // Initialize map centered on centroid, zoomed in
            const map = L.map('positionMap', {
                zoomControl: true,
                attributionControl: false
            }).setView(centroid, 18);

            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            // Draw movement radius circle around centroid
            L.circle(centroid, {
                radius: Math.max(maxRadius, 5), // Minimum 5m radius for visibility
                color: '#FF9500',
                fillColor: '#FF9500',
                fillOpacity: 0.1,
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map).bindPopup(`Movement radius: ${radiusDisplay}`);

            // Draw track as polyline
            const polyline = L.polyline(coords, {
                color: '#007AFF',
                weight: 3,
                opacity: 0.8
            }).addTo(map);

            // Add marker at current position (last point)
            const currentPos = coords[coords.length - 1];
            L.circleMarker(currentPos, {
                radius: 8,
                fillColor: '#FF3B30',
                color: '#fff',
                weight: 2,
                fillOpacity: 1
            }).addTo(map).bindPopup('Current Position');

            // Add marker at centroid
            L.circleMarker(centroid, {
                radius: 6,
                fillColor: '#34C759',
                color: '#fff',
                weight: 2,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('Center Point');

            // Mark farthest point from center
            if (maxRadius > 1) {
                L.circleMarker(farthestPoint, {
                    radius: 5,
                    fillColor: '#FF9500',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup(`Farthest: ${radiusDisplay} from center`);
            }

            // Fit map to circle bounds with padding
            const circleBounds = L.circle(centroid, { radius: Math.max(maxRadius * 1.5, 20) }).getBounds();
            map.fitBounds(circleBounds, { padding: [20, 20] });
        }
    </script>
</body>
</html>
