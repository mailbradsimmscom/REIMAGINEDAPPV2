<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Season Map | BoatOS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #F2F2F7;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .header {
            background: white;
            padding: max(env(safe-area-inset-top), 16px) 16px 16px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #007AFF;
            font-size: 20px;
            transition: background 0.2s;
        }

        .back-button:active {
            background: #E5E5EA;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #000;
        }

        .header-stats {
            font-size: 13px;
            color: #8E8E93;
            font-weight: 500;
        }

        #map {
            width: 100%;
            height: calc(100vh - 70px);
            height: calc(100dvh - 70px);
        }

        /* Loading overlay */
        .map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            font-size: 15px;
            color: #333;
        }

        .map-loading .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #E5E5EA;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Legend */
        .map-legend {
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 13px;
            line-height: 1.6;
        }

        .map-legend h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #000;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* Numbered markers */
        .stop-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .stop-marker.anchor { background: #007AFF; }
        .stop-marker.mooring { background: #FF9500; }
        .stop-marker.marina { background: #5856D6; }

        /* Popup styling */
        .stop-popup h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stop-popup .popup-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stop-popup .popup-type.anchor { background: #007AFF20; color: #007AFF; }
        .stop-popup .popup-type.mooring { background: #FF950020; color: #FF9500; }
        .stop-popup .popup-type.marina { background: #5856D620; color: #5856D6; }

        .stop-popup .popup-detail {
            font-size: 13px;
            color: #555;
            margin: 3px 0;
        }

        .stop-popup .popup-rating {
            font-size: 14px;
            font-weight: 600;
            color: #007AFF;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/public/other-links.html" class="back-button">&larr;</a>
            <h1>Season Map</h1>
        </div>
        <div class="header-stats" id="headerStats"></div>
    </header>

    <div id="map">
        <div class="map-loading" id="mapLoading">
            <div class="spinner"></div>
            <span>Loading season data...</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Mobile Navigation Components -->
    <script src="/public/js/mobile-hamburger.js"></script>
    <script src="/public/js/mobile-nav.js"></script>

    <script>
        class SeasonMap {
            constructor() {
                this.map = null;
                this.anchorages = [];
                this.tripTracks = {};
                this.init();
            }

            async init() {
                this.initMap();
                await this.loadAnchorages();
                await this.loadTripTracks();
                this.render();
                document.getElementById('mapLoading').style.display = 'none';
            }

            initMap() {
                this.map = L.map('map', { zoomControl: true });
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(this.map);
                // Default Caribbean view while loading
                this.map.setView([14.5, -61.0], 9);

                // Add legend
                const legend = L.control({ position: 'bottomright' });
                legend.onAdd = () => {
                    const div = L.DomUtil.create('div', 'map-legend');
                    div.innerHTML = `
                        <h4>Legend</h4>
                        <div class="legend-item"><div class="legend-dot" style="background:#007AFF;"></div> Anchor</div>
                        <div class="legend-item"><div class="legend-dot" style="background:#FF9500;"></div> Mooring</div>
                        <div class="legend-item"><div class="legend-dot" style="background:#5856D6;"></div> Marina</div>
                        <div class="legend-item"><div class="legend-line" style="background:#007AFF;"></div> Passage</div>
                    `;
                    return div;
                };
                legend.addTo(this.map);
            }

            async loadAnchorages() {
                try {
                    const response = await fetch('/api/anchorages');
                    const result = await response.json();
                    if (result.success) {
                        this.anchorages = (result.data || [])
                            .filter(a => a.latitude && a.longitude)
                            .sort((a, b) => new Date(a.arrived_at) - new Date(b.arrived_at));
                    }
                } catch (error) {
                    console.error('Error loading anchorages:', error);
                }
            }

            async loadTripTracks() {
                const tripIds = new Set();
                for (const a of this.anchorages) {
                    if (a.arrival_trip?.id) tripIds.add(a.arrival_trip.id);
                    if (a.departure_trip?.id) tripIds.add(a.departure_trip.id);
                }

                const fetches = [...tripIds].map(async (id) => {
                    try {
                        const response = await fetch(`/api/trips/${id}`);
                        const result = await response.json();
                        if (result.success && result.data?.track?.length > 0) {
                            this.tripTracks[id] = result.data.track;
                        }
                    } catch (error) {
                        console.error(`Error loading trip ${id}:`, error);
                    }
                });

                await Promise.all(fetches);
            }

            render() {
                if (this.anchorages.length === 0) return;

                const bounds = L.latLngBounds();
                const drawnTrips = new Set();
                const typeLabels = { anchor: 'Anchor', mooring: 'Mooring', marina: 'Marina' };

                // Draw passage tracks
                for (const a of this.anchorages) {
                    if (a.departure_trip?.id && !drawnTrips.has(a.departure_trip.id)) {
                        this.drawTrack(a.departure_trip.id);
                        drawnTrips.add(a.departure_trip.id);
                    }
                    if (a.arrival_trip?.id && !drawnTrips.has(a.arrival_trip.id)) {
                        this.drawTrack(a.arrival_trip.id);
                        drawnTrips.add(a.arrival_trip.id);
                    }
                }

                // Draw stop markers
                this.anchorages.forEach((a, i) => {
                    const type = a.anchorage_type || 'anchor';
                    const num = i + 1;

                    const marker = L.marker([a.latitude, a.longitude], {
                        icon: L.divIcon({
                            className: '',
                            html: `<div class="stop-marker ${type}">${num}</div>`,
                            iconSize: [28, 28],
                            iconAnchor: [14, 14]
                        }),
                        zIndexOffset: 1000
                    }).addTo(this.map);

                    const arrived = this.formatDate(a.arrived_at);
                    const departed = a.departed_at ? this.formatDate(a.departed_at) : 'Still here';
                    const rating = this.computeOverall(a.ratings);

                    let popupHtml = `<div class="stop-popup">`;
                    popupHtml += `<h3>#${num} ${this.escapeHtml(a.location_name || 'Unnamed')}</h3>`;
                    popupHtml += `<span class="popup-type ${type}">${typeLabels[type]}</span>`;
                    popupHtml += `<div class="popup-detail">${arrived} &rarr; ${departed}</div>`;
                    popupHtml += `<div class="popup-detail">${a.duration_formatted || 'In progress'}</div>`;
                    if (a.wind_formatted) {
                        popupHtml += `<div class="popup-detail">Wind: ${a.wind_formatted}</div>`;
                    }
                    if (rating) {
                        popupHtml += `<div class="popup-rating">Rating: ${rating}/10</div>`;
                    }
                    popupHtml += `</div>`;

                    marker.bindPopup(popupHtml, { maxWidth: 250 });
                    bounds.extend([a.latitude, a.longitude]);
                });

                for (const track of Object.values(this.tripTracks)) {
                    for (const p of track) {
                        bounds.extend([p.lat, p.lon]);
                    }
                }

                if (bounds.isValid()) {
                    this.map.fitBounds(bounds, { padding: [30, 30] });
                }

                const tripCount = Object.keys(this.tripTracks).length;
                document.getElementById('headerStats').textContent =
                    `${this.anchorages.length} stops \u00B7 ${tripCount} passages`;
            }

            drawTrack(tripId) {
                const track = this.tripTracks[tripId];
                if (!track || track.length < 2) return;
                L.polyline(track.map(p => [p.lat, p.lon]), {
                    color: '#007AFF',
                    weight: 3,
                    opacity: 0.6
                }).addTo(this.map);
            }

            formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            computeOverall(ratings) {
                if (!ratings) return null;
                const vals = Object.values(ratings).filter(v => typeof v === 'number');
                if (vals.length === 0) return null;
                return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
            }

            escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
        }

        document.addEventListener('DOMContentLoaded', () => new SeasonMap());
    </script>
</body>
</html>
