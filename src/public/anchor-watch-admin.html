<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Anchor Watch Administration</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #F2F2F7;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .header {
            background: white;
            padding: max(env(safe-area-inset-top), 16px) 16px 16px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border-radius: 20px;
            background: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #007AFF;
            font-size: 20px;
            transition: background 0.2s;
        }

        .back-button:active {
            background: #E5E5EA;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #000;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: #34C759;
            color: white;
        }

        .status-badge.inactive {
            background: #8E8E93;
            color: white;
        }

        .map-container {
            width: 100%;
            height: 60vh;
            min-height: 400px;
            background: white;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8E8E93;
        }

        .card {
            background: white;
            margin: 16px;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin-bottom: 16px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #F2F2F7;
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #8E8E93;
            font-size: 14px;
        }

        .status-value {
            font-size: 14px;
            font-weight: 500;
            color: #000;
        }

        .status-value.safe {
            color: #34C759;
        }

        .status-value.warning {
            color: #FF9500;
        }

        .status-value.dragging {
            color: #FF3B30;
            font-weight: 600;
        }

        .controls-section {
            margin: 16px 0;
        }

        .button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 12px;
        }

        .button:active:not(:disabled) {
            opacity: 0.8;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-primary {
            background: #007AFF;
            color: white;
        }

        .button-danger {
            background: #FF3B30;
            color: white;
        }

        .button-secondary {
            background: #8E8E93;
            color: white;
        }

        .slider-container {
            margin: 16px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .slider-label span {
            font-size: 14px;
            color: #000;
        }

        .slider-value {
            font-weight: 600;
            color: #007AFF;
        }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #E5E5EA;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
            border: none;
        }

        .coord-inputs {
            margin: 16px 0;
            padding: 12px;
            background: #F2F2F7;
            border-radius: 8px;
        }

        .coord-inputs label {
            display: block;
            font-size: 12px;
            color: #8E8E93;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .coord-inputs input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'SF Mono', Monaco, monospace;
            margin-bottom: 12px;
            background: white;
        }

        .coord-inputs input:focus {
            outline: none;
            border-color: #007AFF;
        }

        .coord-inputs input:last-of-type {
            margin-bottom: 0;
        }

        /* DDM Input Styles */
        .ddm-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .ddm-input-row label {
            font-size: 14px;
            font-weight: 500;
            color: #8E8E93;
            width: 28px;
            margin-bottom: 0;
        }

        .direction-select {
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            background: white;
            width: 54px;
            text-align: center;
        }

        .direction-select:focus {
            outline: none;
            border-color: #007AFF;
        }

        .degrees-input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            background: white;
            width: 60px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .minutes-input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            background: white;
            width: 90px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .degrees-input:focus, .minutes-input:focus {
            outline: none;
            border-color: #007AFF;
        }

        .ddm-symbol {
            font-size: 18px;
            font-weight: 600;
            color: #8E8E93;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 8px;
            font-size: 12px;
            color: #8E8E93;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid #E5E5EA;
        }

        td {
            padding: 8px;
            font-size: 14px;
            color: #000;
            border-bottom: 1px solid #F2F2F7;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.safe {
            background: rgba(52, 199, 89, 0.05);
        }

        tr.warning {
            background: rgba(255, 149, 0, 0.05);
        }

        tr.dragging {
            background: rgba(255, 59, 48, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: #8E8E93;
        }

        .error-message {
            background: #FF3B30;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 16px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #8E8E93;
        }

        /* Leaflet custom icon styles */
        .anchor-icon, .radius-handle-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            font-size: 24px;
        }

        .radius-handle-icon {
            background: white;
            border: 3px solid #007AFF;
            border-radius: 50%;
            width: 24px !important;
            height: 24px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: grab;
            font-size: 16px;
            line-height: 18px;
        }

        .radius-handle-icon:active {
            cursor: grabbing;
        }

        @media (max-width: 600px) {
            .table-container {
                font-size: 12px;
            }

            th, td {
                padding: 6px;
                font-size: 12px;
            }
        }

        /* Login Screen */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #F2F2F7;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 320px;
        }

        .login-box h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #000;
        }

        .login-box p {
            font-size: 14px;
            color: #8E8E93;
            margin-bottom: 24px;
        }

        .pin-input {
            width: 100%;
            padding: 16px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #E5E5EA;
            border-radius: 12px;
            margin-bottom: 16px;
            letter-spacing: 8px;
            font-family: 'SF Mono', Monaco, monospace;
        }

        .pin-input:focus {
            outline: none;
            border-color: #007AFF;
        }

        .login-error {
            color: #FF3B30;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .login-error.visible {
            display: block;
        }

        /* Calculate Panel */
        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .button-row .button {
            flex: 1;
            margin-bottom: 0;
        }

        .calculate-panel {
            background: #F2F2F7;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: none;
        }

        .calculate-panel.visible {
            display: block;
        }

        .calculate-panel label {
            display: block;
            font-size: 12px;
            color: #8E8E93;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .calculate-panel input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 12px;
            background: white;
        }

        .calculate-panel input:focus {
            outline: none;
            border-color: #007AFF;
        }

        .compass-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .compass-display {
            flex: 1;
            background: white;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 24px;
            font-family: 'SF Mono', Monaco, monospace;
            text-align: center;
        }

        .compass-display.locked {
            background: #E8F5E9;
            border-color: #34C759;
        }

        .compass-display .compass-label {
            font-size: 10px;
            color: #8E8E93;
            display: block;
            margin-bottom: 2px;
        }

        .lock-btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            background: #007AFF;
            color: white;
        }

        .lock-btn.locked {
            background: #34C759;
        }

        .manual-bearing {
            margin-top: 8px;
        }

        .manual-bearing input {
            margin-bottom: 0;
        }

        .compass-unavailable {
            font-size: 12px;
            color: #8E8E93;
            text-align: center;
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>⚓ Anchor Watch</h2>
            <p>Enter PIN to continue</p>
            <div id="loginError" class="login-error">Invalid PIN</div>
            <input type="tel" id="pinInput" class="pin-input" maxlength="6" placeholder="••••" autocomplete="off">
            <button id="loginBtn" class="button button-primary" onclick="submitPin()">Login</button>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <a href="/public/unified-mobile.html" class="back-button">←</a>
            <h1>Anchor Watch</h1>
        </div>
        <span id="statusBadge" class="status-badge inactive">Inactive</span>
    </div>

    <!-- Map -->
    <div class="map-container">
        <div id="map">
            <div class="map-loading">Loading map...</div>
        </div>
    </div>

    <!-- Current Status -->
    <div class="card">
        <h2 class="card-title">Current Status</h2>
        <div id="statusContent">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Anchor Watch Controls -->
    <div class="card">
        <h2 class="card-title">Anchor Watch Controls</h2>
        <div id="controlsContent">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Recent Data -->
    <div class="card">
        <h2 class="card-title">Recent Data</h2>
        <div id="positionsContent">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Configuration
        const API_BASE = '/admin/api/anchor-watch';

        // Get token from URL parameter or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (urlToken) {
            localStorage.setItem('adminToken', urlToken);
            // Remove token from URL for security
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        let ADMIN_TOKEN = localStorage.getItem('adminToken') || '';

        const REFRESH_INTERVAL = 20000; // 20 seconds

        // State
        let map = null;
        let markers = {
            boat: null,
            anchor: null,
            zone: null,
            trail: null
        };
        let anchorWatchState = {
            active: false,
            anchor_lat: null,
            anchor_lon: null,
            radius_meters: null
        };
        let refreshTimer = null;
        let isPreviewMode = false; // True when user has inferred position but not activated yet

        // Helper function for API calls
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(API_BASE + endpoint, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Token': ADMIN_TOKEN,
                        ...options.headers
                    }
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'API request failed');
                }

                return data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // Initialize map
        async function initMap() {
            // Fetch current position FIRST before initializing map
            let initialCenter = [0, 0]; // Will be updated
            let initialZoom = 2; // World view as fallback

            try {
                const statusResult = await apiCall('/status');
                if (statusResult.data.current_lat && statusResult.data.current_lon) {
                    initialCenter = [statusResult.data.current_lat, statusResult.data.current_lon];
                    initialZoom = 16;
                } else if (statusResult.data.anchor_lat && statusResult.data.anchor_lon) {
                    // If no current position but have anchor, use that
                    initialCenter = [statusResult.data.anchor_lat, statusResult.data.anchor_lon];
                    initialZoom = 16;
                } else {
                    // No alarm set - fetch current GPS position directly
                    try {
                        const gpsResponse = await fetch('/api/gps/current');
                        const gpsResult = await gpsResponse.json();
                        if (gpsResult.success && gpsResult.data && gpsResult.data.latitude && gpsResult.data.longitude) {
                            initialCenter = [gpsResult.data.latitude, gpsResult.data.longitude];
                            initialZoom = 16;
                        }
                    } catch (gpsError) {
                        console.log('Could not fetch GPS position');
                    }
                }
            } catch (e) {
                console.log('Could not fetch initial position, using world view');
            }

            // Now initialize map with the fetched position
            map = L.map('map').setView(initialCenter, initialZoom);

            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            // Initialize boat marker (blue dot) at current position
            markers.boat = L.circleMarker(initialCenter, {
                radius: 8,
                fillColor: '#007AFF',
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map);
        }

        // Update map with current data
        function updateMap(status, positions) {
            if (!map) return;

            // Update boat position
            if (status.current_lat && status.current_lon) {
                const boatPos = [status.current_lat, status.current_lon];
                markers.boat.setLatLng(boatPos);
            }

            // Update anchor and zone if active
            if (status.active && status.anchor_lat && status.anchor_lon) {
                const anchorPos = [status.anchor_lat, status.anchor_lon];

                // Remove preview elements (they're replaced by active elements)
                if (markers.previewZone) {
                    map.removeLayer(markers.previewZone);
                    markers.previewZone = null;
                }
                if (markers.radiusHandle) {
                    map.removeLayer(markers.radiusHandle);
                    markers.radiusHandle = null;
                }

                // Add/update anchor marker
                if (!markers.anchor) {
                    markers.anchor = L.marker(anchorPos, {
                        icon: L.divIcon({
                            html: '⚓',
                            iconSize: [30, 30],
                            className: 'anchor-icon'
                        }),
                        draggable: false
                    }).addTo(map);
                } else {
                    markers.anchor.setLatLng(anchorPos);
                    // Disable dragging and update icon when anchor watch is active
                    if (markers.anchor.dragging) {
                        markers.anchor.dragging.disable();
                    }
                    markers.anchor.setIcon(L.divIcon({
                        html: '⚓',
                        iconSize: [30, 30],
                        className: 'anchor-icon'
                    }));
                }

                // Add/update zone circle
                const zoneColor = status.status === 'safe' ? '#34C759' :
                                 status.status === 'warning' ? '#FF9500' : '#FF3B30';

                if (!markers.zone) {
                    markers.zone = L.circle(anchorPos, {
                        radius: status.radius_meters,
                        fillColor: zoneColor,
                        fillOpacity: 0.1,
                        color: zoneColor,
                        weight: 2
                    }).addTo(map);
                } else {
                    markers.zone.setLatLng(anchorPos);
                    markers.zone.setRadius(status.radius_meters);
                    markers.zone.setStyle({ color: zoneColor, fillColor: zoneColor });
                }

                // Only center map on initial load, not during auto-refresh in preview mode
                if (!isPreviewMode) {
                    const currentZoom = map.getZoom();
                    map.setView(anchorPos, Math.max(currentZoom, 16));
                }
            } else {
                // Remove ACTIVE anchor and zone if inactive
                // But preserve preview elements (previewZone and radiusHandle) if they exist
                if (markers.anchor && !markers.previewZone) {
                    // Only remove anchor if we're not in preview mode
                    map.removeLayer(markers.anchor);
                    markers.anchor = null;
                }
                if (markers.zone) {
                    map.removeLayer(markers.zone);
                    markers.zone = null;
                }
                // Note: previewZone and radiusHandle are deliberately NOT removed here
                // They persist until the user activates (at which point they're replaced)
            }

            // Update trail with recent positions
            if (positions && positions.length > 0) {
                const trail = positions.map(p => [p.latitude, p.longitude]);

                if (markers.trail) {
                    map.removeLayer(markers.trail);
                }

                markers.trail = L.polyline(trail, {
                    color: '#007AFF',
                    weight: 2,
                    opacity: 0.4,
                    dashArray: '5, 10'
                }).addTo(map);
            }
        }

        // Render current status
        function renderStatus(status) {
            const statusBadge = document.getElementById('statusBadge');
            const statusContent = document.getElementById('statusContent');

            // Update badge
            if (status.active) {
                statusBadge.textContent = 'Active';
                statusBadge.className = 'status-badge active';
            } else {
                statusBadge.textContent = 'Inactive';
                statusBadge.className = 'status-badge inactive';
            }

            // Update status content
            if (!status.active) {
                statusContent.innerHTML = '<div class="empty-state">Anchor watch is not active</div>';
                return;
            }

            const statusClass = status.status === 'safe' ? 'safe' :
                               status.status === 'warning' ? 'warning' : 'dragging';

            const statusText = status.status === 'safe' ? 'Within safe zone' :
                              status.status === 'warning' ? 'Approaching limit' :
                              status.status === 'dragging' ? 'DRAGGING DETECTED' :
                              status.status === 'gps_lost' ? 'GPS SIGNAL LOST' : 'Unknown';

            statusContent.innerHTML = `
                <div class="status-row">
                    <span class="status-label">Distance from Anchor</span>
                    <span class="status-value">${status.distance_meters ? status.distance_meters + ' m' : 'N/A'}</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Current Position</span>
                    <span class="status-value">${status.current_lat ? formatCoordinate(status.current_lat, status.current_lon) : 'N/A'}</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Status</span>
                    <span class="status-value ${statusClass}">${statusText}</span>
                </div>
                <div class="status-row">
                    <span class="status-label">Last Updated</span>
                    <span class="status-value">${status.last_updated ? new Date(status.last_updated).toLocaleTimeString() : 'N/A'}</span>
                </div>
            `;
        }

        // Render controls
        function renderControls(status) {
            const controlsContent = document.getElementById('controlsContent');

            if (!status.active) {
                // Inactive - show activation controls
                const hasInferredPosition = anchorWatchState.anchor_lat && anchorWatchState.anchor_lon;
                const calcPanelVisible = document.getElementById('calculatePanel')?.classList.contains('visible') || false;

                controlsContent.innerHTML = `
                    <div class="controls-section">
                        <div class="button-row">
                            <button id="inferBtn" class="button button-secondary" onclick="inferAnchorPosition()">
                                Infer
                            </button>

                            return `

                                <input type="number" class="degrees-input" id="anchorLonDeg" value="${lonDDM.degrees}" min="0" max="180"

                                       onchange="updateAnchorFromInputs()" oninput="updateAnchorFromInputs()">

                        })() : ''}
                        <div class="slider-container">

                                   oninput="updateRadiusDisplay(this.value)">

                            Activate Anchor Watch
                        </button>
                    </div>
                `;
            } else {
                // Active - show deactivation and adjustment controls
                controlsContent.innerHTML = `
                    <div class="controls-section">
                        <div class="status-row">
                            <span class="status-label">Anchor Position</span>
                            <span class="status-value">${formatCoordinate(status.anchor_lat, status.anchor_lon)}</span>
                        </div>
                        <div class="status-row">
                            <span class="status-label">Watch Radius</span>
                            <span class="status-value">${status.radius_meters} m</span>

                        <div class="slider-container">
                            <div class="slider-label">

                            <input type="range" class="slider" id="radiusSlider"

        }

        // Render positions table
        function renderPositions(positions) {
            const positionsContent = document.getElementById('positionsContent');

            if (!positions || positions.length === 0) {
                positionsContent.innerHTML = '<div class="empty-state">No GPS positions available</div>';
                return;
            }

            let tableHtml = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Position</th>
                                <th>Distance</th>
                                <th>Wind</th>
                                <th>Dir</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            positions.forEach(pos => {
                const time = new Date(pos.timestamp).toLocaleTimeString();
                const latLon = `${pos.latitude.toFixed(4)}, ${pos.longitude.toFixed(4)}`;
                const distance = pos.distance_from_anchor ? pos.distance_from_anchor + ' m' : '-';
                const windSpeed = pos.true_wind_speed != null ? pos.true_wind_speed.toFixed(1) + ' kt' : '-';
                const windDir = pos.true_wind_direction != null ? pos.true_wind_direction.toFixed(0) + '°' : '-';
                const rowClass = pos.status || '';

                tableHtml += `
                    <tr class="${rowClass}">
                        <td>${time}</td>
                        <td>${latLon}</td>
                        <td>${distance}</td>
                        <td>${windSpeed}</td>
                        <td>${windDir}</td>
                    </tr>
                `;
            });

            tableHtml += '</tbody></table></div>';
            positionsContent.innerHTML = tableHtml;
        }

        // Update radius display
        function updateRadiusDisplay(value) {
            document.getElementById('radiusValue').textContent = value + ' m';

            // Update preview circle and handle if they exist (before activation)
            if (markers.previewZone && anchorWatchState.anchor_lat && anchorWatchState.anchor_lon) {
                const radius = parseInt(value);
                markers.previewZone.setRadius(radius);

                // Update handle position to edge of new radius
                if (markers.radiusHandle) {
                    const anchorPos = [anchorWatchState.anchor_lat, anchorWatchState.anchor_lon];
                    const handlePos = calculatePointAtDistance(anchorPos, radius, 45); // 45 degrees
                    markers.radiusHandle.setLatLng(handlePos);
                }
            }
        }

        // Calculate point at distance and bearing from origin
        function calculatePointAtDistance(origin, distanceMeters, bearingDegrees) {
            const R = 6371000; // Earth radius in meters
            const lat1 = origin[0] * Math.PI / 180;
            const lon1 = origin[1] * Math.PI / 180;
            const bearing = bearingDegrees * Math.PI / 180;

            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distanceMeters / R) +
                                   Math.cos(lat1) * Math.sin(distanceMeters / R) * Math.cos(bearing));
            const lon2 = lon1 + Math.atan2(Math.sin(bearing) * Math.sin(distanceMeters / R) * Math.cos(lat1),
                                           Math.cos(distanceMeters / R) - Math.sin(lat1) * Math.sin(lat2));

            return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
        }

        // Format decimal degrees to degrees-decimal minutes (e.g., N 17°4.441' W 61°53.802')
        function formatCoordinate(lat, lon) {
            function toDDM(value, isLat) {
                const abs = Math.abs(value);
                const degrees = Math.floor(abs);
                const minutes = (abs - degrees) * 60;
                const hemisphere = isLat
                    ? (value >= 0 ? 'N' : 'S')
                    : (value >= 0 ? 'E' : 'W');
                return `${hemisphere} ${degrees}°${minutes.toFixed(3)}'`;
            }
            return `${toDDM(lat, true)}  ${toDDM(lon, false)}`;
        }

        /**
         * Convert decimal degrees to DDM components
         */
        function decimalToDDM(decimal, isLat) {
            const abs = Math.abs(decimal);
            const degrees = Math.floor(abs);
            const minutes = (abs - degrees) * 60;
            let direction;
            if (isLat) {
                direction = decimal >= 0 ? 'N' : 'S';
            } else {
                direction = decimal >= 0 ? 'E' : 'W';
            }
            return { direction, degrees, minutes };
        }

        /**
         * Convert DDM to decimal degrees
         */
        function ddmToDecimal(direction, degrees, minutes) {
            const decimal = parseFloat(degrees) + parseFloat(minutes) / 60;
            if (direction === 'S' || direction === 'W') {
                return -decimal;
            }
            return decimal;
        }

        // Parse coordinate that might be in degrees.minutes.decimal format (e.g., 17.04.446)
        // or standard decimal format (e.g., 17.0741)
        function parseCoordinate(input) {
            const str = input.toString().trim();

            // Check for negative
            const isNegative = str.startsWith('-');
            const absStr = isNegative ? str.substring(1) : str;

            // Count dots to detect format
            const dotCount = (absStr.match(/\./g) || []).length;

            let result;
            if (dotCount === 2) {
                // Format: degrees.minutes.decimal (e.g., 17.04.446 = 17° 04.446')
                const parts = absStr.split('.');
                const degrees = parseInt(parts[0], 10);
                const minutes = parseFloat(parts[1] + '.' + parts[2]);
                result = degrees + (minutes / 60);
            } else {
                // Standard decimal format (e.g., 17.0741)
                result = parseFloat(absStr);
            }

            return isNegative ? -result : result;
        }

        // Update anchor position from input fields (input → map sync)
        function updateAnchorFromInputs() {
            const latDir = document.getElementById('anchorLatDir');
            const latDeg = document.getElementById('anchorLatDeg');
            const latMin = document.getElementById('anchorLatMin');
            const lonDir = document.getElementById('anchorLonDir');
            const lonDeg = document.getElementById('anchorLonDeg');
            const lonMin = document.getElementById('anchorLonMin');

            if (!latDir || !latDeg || !latMin || !lonDir || !lonDeg || !lonMin) return;

            const latDegVal = parseFloat(latDeg.value);
            const latMinVal = parseFloat(latMin.value);
            const lonDegVal = parseFloat(lonDeg.value);
            const lonMinVal = parseFloat(lonMin.value);

            // Validate inputs are valid numbers
            if (isNaN(latDegVal) || isNaN(latMinVal) || isNaN(lonDegVal) || isNaN(lonMinVal)) return;

            // Convert DDM to decimal
            const lat = ddmToDecimal(latDir.value, latDegVal, latMinVal);
            const lon = ddmToDecimal(lonDir.value, lonDegVal, lonMinVal);

            // Validate ranges
            if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return;

            // Update state
            anchorWatchState.anchor_lat = lat;
            anchorWatchState.anchor_lon = lon;

            // Update map marker
            if (markers.anchor) {
                markers.anchor.setLatLng([lat, lon]);
            }

            // Update preview circle
            if (markers.previewZone) {
                markers.previewZone.setLatLng([lat, lon]);
            }

            // Update radius handle
            if (markers.radiusHandle) {
                const radius = parseInt(document.getElementById('radiusSlider').value);
                const handlePos = calculatePointAtDistance([lat, lon], radius, 45);
                markers.radiusHandle.setLatLng(handlePos);
            }
        }

        // Update input fields from map marker (map → input sync)
        function updateInputsFromMarker(lat, lon) {
            const latDir = document.getElementById('anchorLatDir');
            const latDeg = document.getElementById('anchorLatDeg');
            const latMin = document.getElementById('anchorLatMin');
            const lonDir = document.getElementById('anchorLonDir');
            const lonDeg = document.getElementById('anchorLonDeg');
            const lonMin = document.getElementById('anchorLonMin');

            if (latDir && latDeg && latMin) {
                const latDDM = decimalToDDM(lat, true);
                latDir.value = latDDM.direction;
                latDeg.value = latDDM.degrees;
                latMin.value = latDDM.minutes.toFixed(3);
            }

            if (lonDir && lonDeg && lonMin) {
                const lonDDM = decimalToDDM(lon, false);
                lonDir.value = lonDDM.direction;
                lonDeg.value = lonDDM.degrees;
                lonMin.value = lonDDM.minutes.toFixed(3);
            }
        }

        // Infer anchor position
        async function inferAnchorPosition() {
            const btn = document.getElementById('inferBtn');
            btn.disabled = true;
            btn.textContent = 'Calculating...';

            try {
                const result = await apiCall('/infer', { method: 'POST' });

                // Store inferred position
                anchorWatchState.anchor_lat = result.data.latitude;
                anchorWatchState.anchor_lon = result.data.longitude;

                // Enable activate button
                document.getElementById('activateBtn').disabled = false;

                // Update button text
                btn.textContent = `Position Set (${result.data.sample_size} samples)`;

                // Show on map
                const anchorPos = [result.data.latitude, result.data.longitude];
                if (!markers.anchor) {
                    markers.anchor = L.marker(anchorPos, {
                        icon: L.divIcon({
                            html: '📍',
                            iconSize: [30, 30],
                            className: 'anchor-icon'
                        }),
                        draggable: true
                    }).addTo(map);

                    // Handle marker drag to update position
                    markers.anchor.on('dragend', function(e) {
                        const newPos = e.target.getLatLng();
                        anchorWatchState.anchor_lat = newPos.lat;
                        anchorWatchState.anchor_lon = newPos.lng;

                        // Update preview circle and handle to follow anchor
                        if (markers.previewZone) {
                            markers.previewZone.setLatLng([newPos.lat, newPos.lng]);
                        }
                        if (markers.radiusHandle) {
                            const radius = parseInt(document.getElementById('radiusSlider').value);
                            const handlePos = calculatePointAtDistance([newPos.lat, newPos.lng], radius, 45);
                            markers.radiusHandle.setLatLng(handlePos);
                        }

                        // Update input fields (map → input sync)
                        updateInputsFromMarker(newPos.lat, newPos.lng);

                        // Show feedback
                        const btn = document.getElementById('inferBtn');
                        btn.textContent = `Position Adjusted`;
                    });
                } else {
                    markers.anchor.setLatLng(anchorPos);
                    markers.anchor.dragging.enable();
                }

                // Create preview circle and radius handle
                const initialRadius = parseInt(document.getElementById('radiusSlider').value);

                // Remove existing preview elements if any
                if (markers.previewZone) map.removeLayer(markers.previewZone);
                if (markers.radiusHandle) map.removeLayer(markers.radiusHandle);

                // Create preview circle
                markers.previewZone = L.circle(anchorPos, {
                    radius: initialRadius,
                    fillColor: '#007AFF',
                    fillOpacity: 0.1,
                    color: '#007AFF',
                    weight: 2,
                    dashArray: '5, 5'
                }).addTo(map);

                // Create draggable radius handle
                const handlePos = calculatePointAtDistance(anchorPos, initialRadius, 45);
                markers.radiusHandle = L.marker(handlePos, {
                    icon: L.divIcon({
                        html: '⚪',
                        iconSize: [24, 24],
                        className: 'radius-handle-icon'
                    }),
                    draggable: true
                }).addTo(map);

                // Handle radius handle drag
                markers.radiusHandle.on('drag', function(e) {
                    const handleLatLng = e.target.getLatLng();
                    const anchor = [anchorWatchState.anchor_lat, anchorWatchState.anchor_lon];

                    // Calculate distance from anchor to handle (Haversine formula)
                    const R = 6371000; // Earth radius in meters
                    const lat1 = anchor[0] * Math.PI / 180;
                    const lat2 = handleLatLng.lat * Math.PI / 180;
                    const deltaLat = (handleLatLng.lat - anchor[0]) * Math.PI / 180;
                    const deltaLng = (handleLatLng.lng - anchor[1]) * Math.PI / 180;

                    const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                              Math.cos(lat1) * Math.cos(lat2) *
                              Math.sin(deltaLng/2) * Math.sin(deltaLng/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    const distance = R * c;

                    // Clamp to slider limits (10-200m)
                    const clampedRadius = Math.max(10, Math.min(200, Math.round(distance / 5) * 5));

                    // Update preview circle
                    markers.previewZone.setRadius(clampedRadius);

                    // Update slider and display
                    document.getElementById('radiusSlider').value = clampedRadius;
                    document.getElementById('radiusValue').textContent = clampedRadius + ' m';
                });

                map.setView(anchorPos, 17);

                // Enter preview mode - prevents auto-refresh from messing with user's setup
                isPreviewMode = true;

                // Re-render controls to show lat/lon input fields
                renderControls({ active: false });

            } catch (error) {
                alert('Failed to calculate anchor position: ' + error.message);
                btn.textContent = 'Infer Anchor Position';
            } finally {
                btn.disabled = false;
            }
        }

        // Activate anchor watch
        async function activateAnchorWatch() {
            if (!anchorWatchState.anchor_lat || !anchorWatchState.anchor_lon) {
                alert('Please infer anchor position first');
                return;
            }

            const radius = parseInt(document.getElementById('radiusSlider').value);
            const btn = document.getElementById('activateBtn');
            btn.disabled = true;

            try {
                await apiCall('/activate', {
                    method: 'POST',
                    body: JSON.stringify({
                        latitude: anchorWatchState.anchor_lat,
                        longitude: anchorWatchState.anchor_lon,
                        radius_meters: radius
                    })
                });

                // Exit preview mode on successful activation
                isPreviewMode = false;

                // Refresh display
                await loadData();
                alert('Anchor watch activated successfully');

            } catch (error) {
                alert('Failed to activate anchor watch: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        // Update radius
        async function updateRadius() {
            const radius = parseInt(document.getElementById('radiusSlider').value);

            try {
                await apiCall('/radius', {
                    method: 'PUT',
                    body: JSON.stringify({ radius_meters: radius })
                });

                await loadData();
                alert('Radius updated successfully');

            } catch (error) {
                alert('Failed to update radius: ' + error.message);
            }
        }

        // Deactivate anchor watch
        async function deactivateAnchorWatch() {
            if (!confirm('Are you sure you want to deactivate anchor watch?')) {
                return;
            }

            try {
                await apiCall('/deactivate', { method: 'POST' });

                // Clear stored state and exit preview mode
                anchorWatchState = {
                    active: false,
                    anchor_lat: null,
                    anchor_lon: null,
                    radius_meters: null
                };
                isPreviewMode = false;

                // Clean up preview elements if they exist
                if (markers.previewZone) {
                    map.removeLayer(markers.previewZone);
                    markers.previewZone = null;
                }
                if (markers.radiusHandle) {
                    map.removeLayer(markers.radiusHandle);
                    markers.radiusHandle = null;
                }

                await loadData();
                alert('Anchor watch deactivated');

            } catch (error) {
                alert('Failed to deactivate: ' + error.message);
            }
        }

        // ============ CALCULATE FROM BOW FUNCTIONS ============

        // Compass state
        let compassState = {
            available: false,
            currentHeading: null,
            lockedBearing: null,
            watchId: null
        };

        // Toggle calculate panel visibility
        function toggleCalculatePanel() {
            const panel = document.getElementById('calculatePanel');
            if (!panel) return;

            const isVisible = panel.classList.toggle('visible');

            if (isVisible) {
                // Fetch current depth and initialize compass
                fetchCurrentDepth();
                initCompass();
            } else {
                // Stop compass when panel closed
                stopCompass();
            }
        }

        // Fetch current depth from GPS endpoint
        async function fetchCurrentDepth() {
            try {
                const response = await fetch('/api/gps/current');
                const result = await response.json();

                if (result.success && result.data && result.data.depth != null) {
                    const depthInput = document.getElementById('depthInput');
                    if (depthInput) {
                        depthInput.value = result.data.depth.toFixed(1);
                    }
                }
            } catch (error) {
                console.log('Could not fetch depth:', error.message);
            }
        }

        // Initialize device compass
        async function initCompass() {
            const compassSection = document.getElementById('compassSection');
            if (!compassSection) return;

            // Check if DeviceOrientationEvent is available
            if (!window.DeviceOrientationEvent) {
                showManualBearingOnly(compassSection, 'Device compass not available');
                return;
            }

            // iOS 13+ requires permission
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        showManualBearingOnly(compassSection, 'Compass permission denied');
                        return;
                    }
                } catch (error) {
                    showManualBearingOnly(compassSection, 'Compass permission error');
                    return;
                }
            }

            // Show compass UI
            compassSection.innerHTML = `
                <div class="compass-container">
                    <div id="compassDisplay" class="compass-display">
                        <span class="compass-label">BEARING</span>
                        <span id="compassValue">---°</span>
                    </div>
                    <button id="lockBtn" class="lock-btn" onclick="toggleLockBearing()">Lock</button>
                </div>
                <div class="manual-bearing">
                    <label>Or enter manually</label>
                    <input type="number" id="manualBearingInput" placeholder="Bearing in degrees" min="0" max="360" step="1">
                </div>
            `;

            compassState.available = true;
            compassState.lockedBearing = null;

            // Start listening to compass
            window.addEventListener('deviceorientationabsolute', handleCompass, true);
            window.addEventListener('deviceorientation', handleCompass, true);
        }

        // Handle compass readings
        function handleCompass(event) {
            if (compassState.lockedBearing !== null) return; // Don't update if locked

            let heading = null;

            // iOS uses webkitCompassHeading
            if (event.webkitCompassHeading !== undefined) {
                heading = event.webkitCompassHeading;
            }
            // Android/others use alpha (but need to invert)
            else if (event.alpha !== null && event.absolute) {
                heading = (360 - event.alpha) % 360;
            }
            else if (event.alpha !== null) {
                heading = (360 - event.alpha) % 360;
            }

            if (heading !== null) {
                compassState.currentHeading = Math.round(heading);
                updateCompassDisplay(compassState.currentHeading);
            }
        }

        // Update compass display
        function updateCompassDisplay(heading) {
            const compassValue = document.getElementById('compassValue');
            if (compassValue) {
                compassValue.textContent = heading + '°';
            }
        }

        // Toggle lock bearing
        function toggleLockBearing() {
            const lockBtn = document.getElementById('lockBtn');
            const compassDisplay = document.getElementById('compassDisplay');

            if (compassState.lockedBearing === null) {
                // Lock the current heading
                compassState.lockedBearing = compassState.currentHeading;
                if (lockBtn) {
                    lockBtn.textContent = 'Unlock';
                    lockBtn.classList.add('locked');
                }
                if (compassDisplay) {
                    compassDisplay.classList.add('locked');
                }
            } else {
                // Unlock
                compassState.lockedBearing = null;
                if (lockBtn) {
                    lockBtn.textContent = 'Lock';
                    lockBtn.classList.remove('locked');
                }
                if (compassDisplay) {
                    compassDisplay.classList.remove('locked');
                }
            }
        }

        // Stop compass
        function stopCompass() {
            window.removeEventListener('deviceorientationabsolute', handleCompass, true);
            window.removeEventListener('deviceorientation', handleCompass, true);
            compassState.currentHeading = null;
            compassState.lockedBearing = null;
        }

        // Show manual bearing input only
        function showManualBearingOnly(container, message) {
            compassState.available = false;
            container.innerHTML = `
                <div class="compass-unavailable">${message}</div>
                <div class="manual-bearing">
                    <input type="number" id="manualBearingInput" placeholder="Bearing in degrees" min="0" max="360" step="1">
                </div>
            `;
        }

        // Get the bearing to use for calculation
        function getBearing() {
            // Priority: locked compass > manual input > current compass
            if (compassState.lockedBearing !== null) {
                return compassState.lockedBearing;
            }

            const manualInput = document.getElementById('manualBearingInput');
            if (manualInput && manualInput.value) {
                const manual = parseFloat(manualInput.value);
                if (!isNaN(manual) && manual >= 0 && manual <= 360) {
                    return manual;
                }
            }

            if (compassState.currentHeading !== null) {
                return compassState.currentHeading;
            }

            return null;
        }

        // Calculate destination point given start, bearing, and distance
        function destinationPoint(lat1, lon1, bearingDeg, distanceMeters) {
            const R = 6371000; // Earth radius in meters
            const d = distanceMeters / R; // Angular distance
            const brng = bearingDeg * Math.PI / 180; // Bearing in radians
            const lat1Rad = lat1 * Math.PI / 180;
            const lon1Rad = lon1 * Math.PI / 180;

            const lat2Rad = Math.asin(
                Math.sin(lat1Rad) * Math.cos(d) +
                Math.cos(lat1Rad) * Math.sin(d) * Math.cos(brng)
            );

            const lon2Rad = lon1Rad + Math.atan2(
                Math.sin(brng) * Math.sin(d) * Math.cos(lat1Rad),
                Math.cos(d) - Math.sin(lat1Rad) * Math.sin(lat2Rad)
            );

            return {
                latitude: lat2Rad * 180 / Math.PI,
                longitude: lon2Rad * 180 / Math.PI
            };
        }

        // Calculate anchor position from bow
        async function calculateAnchorPosition() {
            // Get inputs
            const scopeInput = document.getElementById('scopeInput');
            const depthInput = document.getElementById('depthInput');

            const scope = parseFloat(scopeInput?.value);
            const depth = parseFloat(depthInput?.value);
            const bearing = getBearing();

            // Validate inputs
            if (isNaN(scope) || scope <= 0) {
                alert('Please enter a valid scope (chain/rode length)');
                return;
            }

            if (isNaN(depth) || depth <= 0) {
                alert('Please enter a valid depth');
                return;
            }

            if (depth >= scope) {
                alert('Scope must be greater than depth');
                return;
            }

            if (bearing === null) {
                alert('Please lock a compass bearing or enter one manually');
                return;
            }

            // Calculate horizontal distance
            const horizontalDistance = Math.sqrt(scope * scope - depth * depth);

            // Get current GPS position
            try {
                const response = await fetch('/api/gps/current');
                const result = await response.json();

                if (!result.success || !result.data || !result.data.latitude) {
                    alert('Could not get current GPS position');
                    return;
                }

                const currentLat = result.data.latitude;
                const currentLon = result.data.longitude;

                // Calculate anchor position
                const anchorPos = destinationPoint(currentLat, currentLon, bearing, horizontalDistance);

                // Update state
                anchorWatchState.anchor_lat = anchorPos.latitude;
                anchorWatchState.anchor_lon = anchorPos.longitude;

                // Enter preview mode
                isPreviewMode = true;

                // Show on map (similar to inferAnchorPosition)
                const anchorLatLng = [anchorPos.latitude, anchorPos.longitude];

                if (!markers.anchor) {
                    markers.anchor = L.marker(anchorLatLng, {
                        icon: L.divIcon({
                            html: '📍',
                            iconSize: [30, 30],
                            className: 'anchor-icon'
                        }),
                        draggable: true
                    }).addTo(map);

                    markers.anchor.on('dragend', function(e) {
                        const newPos = e.target.getLatLng();
                        anchorWatchState.anchor_lat = newPos.lat;
                        anchorWatchState.anchor_lon = newPos.lng;

                        if (markers.previewZone) {
                            markers.previewZone.setLatLng([newPos.lat, newPos.lng]);
                        }
                        if (markers.radiusHandle) {
                            const radius = parseInt(document.getElementById('radiusSlider')?.value || 50);
                            const handlePos = calculatePointAtDistance([newPos.lat, newPos.lng], radius, 45);
                            markers.radiusHandle.setLatLng(handlePos);
                        }

                        updateInputsFromMarker(newPos.lat, newPos.lng);
                    });
                } else {
                    markers.anchor.setLatLng(anchorLatLng);
                    if (markers.anchor.dragging) markers.anchor.dragging.enable();
                }

                // Create preview circle
                const initialRadius = parseInt(document.getElementById('radiusSlider')?.value || 50);

                if (markers.previewZone) map.removeLayer(markers.previewZone);
                if (markers.radiusHandle) map.removeLayer(markers.radiusHandle);

                markers.previewZone = L.circle(anchorLatLng, {
                    radius: initialRadius,
                    fillColor: '#007AFF',
                    fillOpacity: 0.1,
                    color: '#007AFF',
                    weight: 2,
                    dashArray: '5, 5'
                }).addTo(map);

                const handlePos = calculatePointAtDistance(anchorLatLng, initialRadius, 45);
                markers.radiusHandle = L.marker(handlePos, {
                    icon: L.divIcon({
                        html: '⚪',
                        iconSize: [24, 24],
                        className: 'radius-handle-icon'
                    }),
                    draggable: true
                }).addTo(map);

                markers.radiusHandle.on('drag', function(e) {
                    const handleLatLng = e.target.getLatLng();
                    const anchor = [anchorWatchState.anchor_lat, anchorWatchState.anchor_lon];

                    const R = 6371000;
                    const lat1 = anchor[0] * Math.PI / 180;
                    const lat2 = handleLatLng.lat * Math.PI / 180;
                    const deltaLat = (handleLatLng.lat - anchor[0]) * Math.PI / 180;
                    const deltaLng = (handleLatLng.lng - anchor[1]) * Math.PI / 180;

                    const a = Math.sin(deltaLat/2) * Math.sin(deltaLat/2) +
                              Math.cos(lat1) * Math.cos(lat2) *
                              Math.sin(deltaLng/2) * Math.sin(deltaLng/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    const distance = R * c;

                    const clampedRadius = Math.max(10, Math.min(200, Math.round(distance / 5) * 5));

                    markers.previewZone.setRadius(clampedRadius);
                    document.getElementById('radiusSlider').value = clampedRadius;
                    document.getElementById('radiusValue').textContent = clampedRadius + ' m';
                });

                map.setView(anchorLatLng, 17);

                // Re-render controls to show lat/lon input fields
                renderControls({ active: false });

                // Close calculate panel
                const panel = document.getElementById('calculatePanel');
                if (panel) panel.classList.remove('visible');
                stopCompass();

            } catch (error) {
                alert('Error calculating position: ' + error.message);
            }
        }

        // ============ END CALCULATE FROM BOW FUNCTIONS ============

        // Load all data
        async function loadData() {
            try {
                // Fetch status and positions in parallel
                const [statusResult, positionsResult] = await Promise.all([
                    apiCall('/status'),
                    apiCall('/positions?limit=20')
                ]);

                const status = statusResult.data;
                const positions = positionsResult.data.positions;

                // Update state - but preserve local values during preview mode
                if (isPreviewMode && !status.active) {
                    // In preview mode, only update active status, keep local anchor position
                    anchorWatchState.active = status.active;
                } else {
                    anchorWatchState = {
                        active: status.active,
                        anchor_lat: status.anchor_lat,
                        anchor_lon: status.anchor_lon,
                        radius_meters: status.radius_meters
                    };
                    // Exit preview mode if anchor watch becomes active
                    if (status.active) {
                        isPreviewMode = false;
                    }
                }

                // Update display
                renderStatus(status);
                // Don't re-render controls during preview mode or when calculate panel is open
                const calculatePanelOpen = document.getElementById('calculatePanel')?.classList.contains('visible');
                if (!isPreviewMode && !calculatePanelOpen) {
                    renderControls(status);
                }
                renderPositions(positions);
                updateMap(status, positions);

            } catch (error) {
                console.error('Failed to load data:', error);
                document.getElementById('statusContent').innerHTML =
                    '<div class="error-message">Failed to load status data</div>';
            }
        }

        // Start auto-refresh
        function startAutoRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
            refreshTimer = setInterval(loadData, REFRESH_INTERVAL);
        }

        // Show login overlay
        function showLogin() {
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('pinInput').focus();
        }

        // Hide login overlay and start app
        async function hideLoginAndStart() {
            document.getElementById('loginOverlay').classList.add('hidden');

            // Initialize map
            await initMap();

            // Load initial data
            loadData();

            // Start auto-refresh
            startAutoRefresh();
        }

        // Submit PIN for authentication
        async function submitPin() {
            const pinInput = document.getElementById('pinInput');
            const loginError = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');

            const pin = pinInput.value.trim();

            if (!pin) {
                loginError.textContent = 'Please enter PIN';
                loginError.classList.add('visible');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying...';
            loginError.classList.remove('visible');

            try {
                const response = await fetch('/api/auth/pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Invalid PIN');
                }

                // Store token and update global variable
                localStorage.setItem('adminToken', data.token);
                ADMIN_TOKEN = data.token;

                // Start the app
                await hideLoginAndStart();

            } catch (error) {
                loginError.textContent = error.message;
                loginError.classList.add('visible');
                pinInput.value = '';
                pinInput.focus();
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            // Check for admin token
            if (!ADMIN_TOKEN) {
                // Show login instead of redirecting
                showLogin();

                // Handle Enter key on PIN input
                document.getElementById('pinInput').addEventListener('keyup', (e) => {
                    if (e.key === 'Enter') submitPin();
                });

                return;
            }

            // Hide login overlay if we have token
            document.getElementById('loginOverlay').classList.add('hidden');

            // Initialize map
            await initMap();

            // Load initial data
            loadData();

            // Start auto-refresh
            startAutoRefresh();
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
        });
    </script>
