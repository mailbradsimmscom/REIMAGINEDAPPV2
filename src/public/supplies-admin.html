<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Manage Supply Options | BoatOS</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/css/supplies.css">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <style>
    /* Admin-specific styles */
    .admin-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary-color, #007AFF);
      text-decoration: none;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .admin-header {
      margin-bottom: 1.5rem;
    }

    .admin-header h1 {
      font-size: 1.5rem;
      margin: 0 0 0.25rem 0;
    }

    .admin-header p {
      color: var(--text-secondary, #666);
      margin: 0;
      font-size: 0.9rem;
    }

    /* Tabs */
    .admin-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border-color, #e0e0e0);
      margin-bottom: 1.5rem;
    }

    .admin-tab {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      font-size: 1rem;
      color: var(--text-secondary, #666);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .admin-tab:hover {
      color: var(--primary-color, #007AFF);
    }

    .admin-tab.active {
      color: var(--primary-color, #007AFF);
      border-bottom-color: var(--primary-color, #007AFF);
      font-weight: 500;
    }

    /* Tab Content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Add Form */
    .add-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .add-form input {
      flex: 1;
      min-width: 150px;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border-color, #ccc);
      border-radius: var(--border-radius, 8px);
      font-size: 0.95rem;
    }

    .add-form button {
      padding: 0.6rem 1rem;
      background: var(--primary-color, #007AFF);
      color: white;
      border: none;
      border-radius: var(--border-radius, 8px);
      cursor: pointer;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .add-form button:hover {
      opacity: 0.9;
    }

    /* Items List */
    .items-list {
      background: var(--bg-card, #fff);
      border-radius: var(--border-radius, 8px);
      border: 1px solid var(--border-color, #e0e0e0);
      overflow: hidden;
    }

    .item-row {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color, #e0e0e0);
      gap: 1rem;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .item-row.editing {
      background: var(--bg-secondary, #f5f5f5);
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-weight: 500;
      word-break: break-word;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-secondary, #666);
    }

    .item-actions {
      display: flex;
      gap: 0.5rem;
    }

    .item-actions button {
      padding: 0.4rem 0.6rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-edit {
      background: var(--bg-secondary, #f0f0f0);
      color: var(--text-primary, #333);
    }

    .btn-delete {
      background: #fee;
      color: #c00;
    }

    .btn-save {
      background: var(--primary-color, #007AFF);
      color: white;
    }

    .btn-cancel {
      background: var(--bg-secondary, #f0f0f0);
      color: var(--text-primary, #333);
    }

    /* Edit inputs */
    .edit-inputs {
      display: flex;
      gap: 0.5rem;
      flex: 1;
      flex-wrap: wrap;
    }

    .edit-inputs input {
      flex: 1;
      min-width: 100px;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border-color, #ccc);
      border-radius: 4px;
      font-size: 0.9rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary, #666);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
    }

    .toast {
      background: #333;
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.3s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    .toast-success { background: #28a745; }
    .toast-error { background: #dc3545; }
  </style>
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div class="admin-container">
    <a href="/supplies" class="back-link">← Back to Supplies</a>

    <div class="admin-header">
      <h1>Manage Supply Options</h1>
      <p>Add, edit, or remove categories, units, and locations</p>
    </div>

    <!-- Tabs -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="categories">Categories</button>
      <button class="admin-tab" data-tab="units">Units</button>
      <button class="admin-tab" data-tab="locations">Locations</button>
    </div>

    <!-- Categories Tab -->
    <div class="tab-content active" id="tab-categories">
      <form class="add-form" id="addCategoryForm">
        <input type="text" name="category_name" placeholder="Category name" required>
        <button type="submit">+ Add Category</button>
      </form>
      <div class="items-list" id="categoriesList">
        <div class="empty-state">
          <div class="empty-state-icon">📁</div>
          <p>Loading categories...</p>
        </div>
      </div>
    </div>

    <!-- Units Tab -->
    <div class="tab-content" id="tab-units">
      <form class="add-form" id="addUnitForm">
        <input type="text" name="unit_name" placeholder="Unit name (e.g., Liters)" required>
        <input type="text" name="abbreviation" placeholder="Abbreviation (e.g., L)" required>
        <button type="submit">+ Add</button>
      </form>
      <div class="items-list" id="unitsList">
        <div class="empty-state">
          <div class="empty-state-icon">📏</div>
          <p>Loading units...</p>
        </div>
      </div>
    </div>

    <!-- Locations Tab -->
    <div class="tab-content" id="tab-locations">
      <form class="add-form" id="addLocationForm">
        <input type="text" name="name" placeholder="Location name" required>
        <input type="text" name="description" placeholder="Description (optional)">
        <button type="submit">+ Add</button>
      </form>
      <div class="items-list" id="locationsList">
        <div class="empty-state">
          <div class="empty-state-icon">📍</div>
          <p>Loading locations...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/js/supplies/supplies-admin.js"></script>

  <!-- Mobile Navigation Component -->
  <script src="/public/js/mobile-nav.js"></script>
</body>
</html>
