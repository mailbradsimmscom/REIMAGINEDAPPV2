version: '3.8'

services:
  python-chat-service:
    build: .
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${PY_SUPABASE_SERVICE_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.eriquneakfcfmeecqyof:KaZyZqcSDxjh0bYS@aws-0-us-west-1.pooler.supabase.com:6543/postgres}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./scripts:/app/scripts  # For any future utility scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3