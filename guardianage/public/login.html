<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reimagined Guardianage</title>
  <link rel="stylesheet" href="/guardianage/public/css/guardianage.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <h1>Reimagined Guardianage</h1>
      <p>Vessel care management</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="loginId">User ID</label>
        <input type="text" id="loginId" name="login_id" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div id="errorMessage" class="error-message" style="display: none;"></div>

      <button type="submit" id="loginBtn" class="btn btn-primary btn-full">Sign In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/guardianage/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login_id: document.getElementById('loginId').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = '/guardianage';
        } else {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = 'Connection error. Try again.';
        errorEl.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
