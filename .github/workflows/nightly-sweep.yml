# .github/workflows/nightly-sweep.yml
#
# Nightly Full Sweep
# Runs at 3am EST (8am UTC) against production
# Tests all routes and UI pages
#
# Can also be triggered manually from GitHub Actions UI

name: Nightly Sweep

on:
  schedule:
    - cron: '0 8 * * *'  # 3am EST = 8am UTC
  workflow_dispatch:      # Manual trigger from GitHub UI

env:
  PRODUCTION_URL: https://boatos-main.onrender.com
  PYTHON_SIDECAR_URL: https://boatos-python.onrender.com
  MAINTENANCE_URL: https://boatos-maintenance.onrender.com
  NODE_ENV: production

jobs:
  # ============================================
  # Wake up Render services (cold start)
  # ============================================
  wake-services:
    name: Wake Services
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake up Render services
        run: |
          echo "Waking up main service..."
          curl -sf ${{ env.PRODUCTION_URL }}/health || echo "Main service warming up..."

          echo "Waking up Python sidecar..."
          curl -sf ${{ env.PYTHON_SIDECAR_URL }}/health || echo "Python sidecar warming up..."

          echo "Waking up maintenance agent..."
          curl -sf ${{ env.MAINTENANCE_URL }}/health || echo "Maintenance agent warming up..."

          echo "Waiting 45 seconds for cold start..."
          sleep 45

          echo "Verifying services are up..."
          curl -sf ${{ env.PRODUCTION_URL }}/health
          curl -sf ${{ env.PYTHON_SIDECAR_URL }}/health
          curl -sf ${{ env.MAINTENANCE_URL }}/health || echo "Maintenance agent not available (optional)"

          echo ""
          echo "=== Sidecar Connectivity Check ==="
          echo "PYTHON_SIDECAR_URL (from env): ${{ env.PYTHON_SIDECAR_URL }}"
          echo "PYTHON_SIDECAR_URL (from secret): ${{ secrets.PYTHON_SIDECAR_URL }}"
          echo ""
          echo "Testing sidecar health endpoint..."
          HEALTH_RESPONSE=$(curl -sS -m 10 "${{ secrets.PYTHON_SIDECAR_URL }}/health" 2>&1) || {
            echo "FAILED: Sidecar unreachable from CI"
            echo "Response: $HEALTH_RESPONSE"
            echo ""
            echo "This is an INFRASTRUCTURE issue, not app code."
            exit 1
          }
          echo "SUCCESS: Sidecar is reachable from CI"
          echo "Response: $HEALTH_RESPONSE"

  # ============================================
  # Main nightly sweep
  # ============================================
  nightly-sweep:
    name: Nightly Sweep
    runs-on: ubuntu-latest
    needs: wake-services
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Create results directory
        run: mkdir -p results

      - name: Record start time
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: |
          cd python-sidecar
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Discover UI pages
        run: node scripts/discover-ui-pages.js

      - name: Run Python Tests
        run: cd python-sidecar && pytest tests -v --tb=short 2>&1 | tee ../results/python.txt || true
        timeout-minutes: 3
        env:
          CHAT_MODULE_ENABLED: 'true'
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run Unit Tests
        run: |
          node --test --test-force-exit \
            tests/unit/config/env.test.js \
            tests/unit/fixture-validation.test.js \
            tests/unit/middleware/admin.test.js \
            tests/unit/middleware/serviceGuards.test.js \
            tests/unit/repositories/guards.test.js \
            tests/unit/services/chat-proxy.service.test.js \
            tests/unit/services/guards.test.js \
            tests/unit/services/query-normalizer.test.js \
            tests/unit/services/service-guards.test.js \
            tests/unit/validation/debug.test.js \
            tests/unit/validation/method-guards.test.js \
            2>&1 | tee results/unit.txt || true
        timeout-minutes: 2
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}

      - name: Run E2E Tests (Playwright)
        run: |
          CI=true BASE_URL=${{ env.PRODUCTION_URL }} \
            npx playwright test \
            tests/e2e/admin-dashboard.spec.js \
            tests/e2e/chat-flow.spec.js \
            tests/e2e/error-handling.spec.js \
            --reporter=json \
            2>&1 | tee results/playwright-e2e.json || true
        timeout-minutes: 10
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Run Nightly UI Sweep (Playwright)
        run: |
          CI=true BASE_URL=${{ env.PRODUCTION_URL }} MAINTENANCE_URL=${{ env.MAINTENANCE_URL }} \
            npx playwright test tests/nightly/ui-all.spec.js \
            --reporter=json \
            2>&1 | tee results/playwright-nightly.json || true
        timeout-minutes: 10
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Run Integration Tests
        run: |
          node --test --test-force-exit \
            tests/integration/admin-auth.test.js \
            tests/integration/admin.test.js \
            tests/integration/bad-input-matrix.test.js \
            tests/integration/bad-input.test.js \
            tests/integration/chat.process.normalization.test.js \
            tests/integration/chat.test.js \
            tests/integration/comprehensive-validation.test.js \
            tests/integration/contract-fit.test.js \
            tests/integration/document.test.js \
            tests/integration/golden-rules-validation.test.js \
            tests/integration/health.test.js \
            tests/integration/monitoring.test.js \
            tests/integration/openai-client.test.js \
            tests/integration/phase-d3-core.test.js \
            tests/integration/phase2-achievements.test.js \
            tests/integration/phase2-demo.test.js \
            tests/integration/phase3-achievements.test.js \
            tests/integration/pinecone.test.js \
            tests/integration/response-validation.test.js \
            tests/integration/retrieval-spec.test.js \
            tests/integration/schema-validation.test.js \
            tests/integration/security.test.js \
            tests/integration/spec-bias-telemetry.test.js \
            tests/integration/style-detection.test.js \
            tests/integration/systems.test.js \
            tests/integration/test-infrastructure.test.js \
            2>&1 | tee results/integration.txt || true
        timeout-minutes: 10
        env:
          ENABLE_ROUTE_DEBUG: '1'
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PYTHON_SIDECAR_URL: ${{ secrets.PYTHON_SIDECAR_URL }}

      - name: Run Smoke Tests
        run: |
          node --test --test-force-exit \
            tests/smoke/route-map.test.js \
            tests/smoke/router-imports.test.js \
            2>&1 | tee results/smoke.txt || true
        timeout-minutes: 2
        env:
          ENABLE_ROUTE_DEBUG: '1'  # Required for route-map.test.js
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PYTHON_SIDECAR_URL: ${{ secrets.PYTHON_SIDECAR_URL }}

      - name: Run Chat Timing Tests
        run: |
          node tests/nightly/chat-timing.test.js 2>&1 | tee results/chat-timing-output.txt || true
        timeout-minutes: 10
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
          PYTHON_SIDECAR_URL: ${{ secrets.PYTHON_SIDECAR_URL }}

      - name: Debug results directory
        if: always()
        run: |
          echo "Results dir contents:"
          ls -la results/ || echo "results/ not found"
          if [ -f results/playwright.json ]; then
            echo "Found results/playwright.json: $(wc -c < results/playwright.json) bytes"
          else
            echo "MISSING: results/playwright.json"
          fi

      - name: Upload test results to Supabase
        id: upload-results
        run: node scripts/upload-test-results.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_TYPE: nightly
          ENVIRONMENT: production
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: results/
          retention-days: 14

  # ============================================
  # Post-sweep cleanup
  # ============================================
  cleanup-after:
    name: Post-Sweep Cleanup
    runs-on: ubuntu-latest
    needs: nightly-sweep
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Final cleanup
        run: node scripts/cleanup-test-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

  # ============================================
  # Verify cleanup was successful
  # ============================================
  verify-cleanup:
    name: Verify Cleanup
    runs-on: ubuntu-latest
    needs: cleanup-after
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify no test data remains
        run: node scripts/verify-cleanup.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

  # ============================================
  # Summary
  # ============================================
  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [nightly-sweep, verify-cleanup]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Nightly Sweep Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.nightly-sweep.result }}" == "success" ]; then
            echo "- :white_check_mark: Nightly tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Nightly tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.verify-cleanup.result }}" == "success" ]; then
            echo "- :white_check_mark: Cleanup verified" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :warning: Cleanup verification failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See test dashboard for detailed results." >> $GITHUB_STEP_SUMMARY
