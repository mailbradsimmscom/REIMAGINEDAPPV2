# .github/workflows/nightly-sweep.yml
#
# Nightly Full Sweep
# Runs at 3am EST (8am UTC) against production
# Tests all routes and UI pages
#
# Can also be triggered manually from GitHub Actions UI

name: Nightly Sweep

on:
  schedule:
    - cron: '0 8 * * *'  # 3am EST = 8am UTC
  workflow_dispatch:      # Manual trigger from GitHub UI

env:
  PRODUCTION_URL: https://boatos-main.onrender.com
  PYTHON_SIDECAR_URL: https://boatos-python.onrender.com
  NODE_ENV: test

jobs:
  # ============================================
  # Pre-sweep cleanup of stale test data
  # ============================================
  cleanup-before:
    name: Pre-Sweep Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cleanup stale test data
        run: node scripts/cleanup-test-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ============================================
  # Wake up Render services (cold start)
  # ============================================
  wake-services:
    name: Wake Services
    runs-on: ubuntu-latest
    needs: cleanup-before
    timeout-minutes: 5

    steps:
      - name: Wake up Render services
        run: |
          echo "Waking up main service..."
          curl -sf ${{ env.PRODUCTION_URL }}/health || echo "Main service warming up..."

          echo "Waking up Python sidecar..."
          curl -sf ${{ env.PYTHON_SIDECAR_URL }}/health || echo "Python sidecar warming up..."

          echo "Waiting 45 seconds for cold start..."
          sleep 45

          echo "Verifying services are up..."
          curl -sf ${{ env.PRODUCTION_URL }}/health
          curl -sf ${{ env.PYTHON_SIDECAR_URL }}/health

  # ============================================
  # Main nightly sweep
  # ============================================
  nightly-sweep:
    name: Nightly Sweep
    runs-on: ubuntu-latest
    needs: wake-services
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Create results directory
        run: mkdir -p results

      - name: Record start time
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Discover UI pages
        run: node scripts/discover-ui-pages.js

      # Run tests in parallel where possible
      - name: Run Unit Tests
        run: npm run test:unit 2>&1 | tee results/unit.txt || true

      - name: Run Integration Tests (against production)
        run: npm run test:integration 2>&1 | tee results/integration.txt || true
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Run E2E Tests (against production)
        run: npx playwright test --reporter=json > results/playwright.json || true
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Upload test results to Supabase
        run: node scripts/upload-test-results.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_TYPE: nightly
          ENVIRONMENT: production
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: results/
          retention-days: 14

  # ============================================
  # Post-sweep cleanup
  # ============================================
  cleanup-after:
    name: Post-Sweep Cleanup
    runs-on: ubuntu-latest
    needs: nightly-sweep
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Final cleanup
        run: node scripts/cleanup-test-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ============================================
  # Verify cleanup was successful
  # ============================================
  verify-cleanup:
    name: Verify Cleanup
    runs-on: ubuntu-latest
    needs: cleanup-after
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify no test data remains
        run: node scripts/verify-cleanup.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ============================================
  # Summary
  # ============================================
  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [nightly-sweep, verify-cleanup]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Nightly Sweep Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.nightly-sweep.result }}" == "success" ]; then
            echo "- :white_check_mark: Nightly tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Nightly tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.verify-cleanup.result }}" == "success" ]; then
            echo "- :white_check_mark: Cleanup verified" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :warning: Cleanup verification failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See test dashboard for detailed results." >> $GITHUB_STEP_SUMMARY
